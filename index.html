<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pinguim Runner - Visual 2D</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020810;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    #game {
      width: 480px;
      height: 640px;
      background: linear-gradient(#0a1428 0%, #122540 40%, #1a3a5c 70%, #2a5a7a 100%);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 6px #1e3a5c, 0 25px 60px rgba(0,0,0,0.7);
    }

    /* Aurora */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
    }
    .aurora1 {
      background: radial-gradient(ellipse at 30% 40%, rgba(0,255,180,0.25) 0%, transparent 60%);
      animation: auroraMove 14s ease-in-out infinite alternate;
    }
    .aurora2 {
      background: radial-gradient(ellipse at 70% 30%, rgba(140,80,255,0.2) 0%, transparent 60%);
      animation: auroraMove 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes auroraMove {
      0% { transform: translateX(-20px) scale(1); opacity: 0.7; }
      100% { transform: translateX(30px) scale(1.1); opacity: 1; }
    }

    /* Neve */
    .snow {
      position: absolute;
      background: white;
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      box-shadow: 0 0 6px white;
    }
    @keyframes snowFall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0.9; }
      100% { transform: translateY(700px) translateX(30px); opacity: 0.1; }
    }

    /* Chão */
    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: linear-gradient(#c8eaf8, #8ec8e0);
      border-top: 4px solid #e0f4ff;
      z-index: 3;
      box-shadow: inset 0 12px 20px rgba(255,255,255,0.4);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    #score, #lives, #hiscore {
      background: rgba(0,0,0,0.55);
      color: white;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      backdrop-filter: blur(6px);
    }
    #lives { color: #ff6b6b; }

    /* ===== PINGUIM 2D ===== */
    #penguin {
      position: absolute;
      bottom: 90px;
      left: 130px;
      font-size: 52px;
      z-index: 10;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.3));
      transition: transform 0.1s;
      user-select: none;
    }
    #penguin.running {
      animation: runBob 0.3s ease-in-out infinite;
    }
    @keyframes runBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ===== PEIXE 2D (no chão) ===== */
    .fish {
      position: absolute;
      bottom: 95px;
      font-size: 32px;
      z-index: 8;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25));
      user-select: none;
    }

    /* ===== ORCA 2D ===== */
    .orca {
      position: absolute;
      bottom: 90px;
      font-size: 56px;
      z-index: 9;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
      user-select: none;
    }

    /* ===== PLATAFORMA DE GELO 2D ===== */
    .platform {
      position: absolute;
      height: 22px;
      background: linear-gradient(#e0f7ff, #a8d8f0);
      border-radius: 12px;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 12px rgba(0,80,120,0.25), inset 0 4px 8px rgba(255,255,255,0.6);
      z-index: 7;
    }

    .popup {
      position: absolute;
      font-size: 18px;
      font-weight: 900;
      color: #ffeb3b;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      animation: popup 0.7s forwards;
    }
    @keyframes popup {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }

    /* Tela de mensagem */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      padding: 32px 36px;
      border-radius: 24px;
      text-align: center;
      z-index: 30;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      display: none;
      min-width: 280px;
    }
    #message h1 {
      font-size: 28px;
      color: #0d47a1;
      margin-bottom: 8px;
    }
    #message p {
      font-size: 15px;
      color: #1565c0;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    #start-btn {
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(33,150,243,0.4);
      transition: 0.2s;
    }
    #start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(33,150,243,0.5);
    }
  </style>
</head>
<body>

  <div id="game">
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>

    <div id="hud">
      <div id="score">Pontos: 0</div>
      <div id="lives">❤️❤️❤️</div>
      <div id="hiscore">Recorde: 0</div>
    </div>

    <div id="penguin">🐧</div>
    <div id="ground"></div>

    <div id="message">
      <h1>Pinguim Runner</h1>
      <p>
        Pule nas plataformas<br>
        Pegue os peixes no chão<br>
        Fuja das orcas!
      </p>
      <button id="start-btn">Começar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'gameover') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (type === 'start') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        osc.frequency.setValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const hiscoreEl = document.getElementById('hiscore');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('pinguim2dHigh') || '0');
    let penguinX = 130;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let invincible = false;
    let onPlatform = false;
    let fishTimer, orcaTimer, platformTimer;
    let animId;
    let difficulty = 1;
    let runSpeed = 3.3;
    let distance = 0;

    const gravity = 0.85;
    const jumpPower = -15.5;

    hiscoreEl.textContent = 'Recorde: ' + highScore;

    // Neve
    for (let i = 0; i < 40; i++) {
      const flake = document.createElement('div');
      flake.className = 'snow';
      const size = 2 + Math.random() * 4;
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.left = Math.random() * 480 + 'px';
      flake.style.animation = `snowFall ${5 + Math.random() * 6}s linear infinite`;
      flake.style.animationDelay = Math.random() * 8 + 's';
      flake.style.opacity = 0.5 + Math.random() * 0.5;
      game.appendChild(flake);
    }

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        onPlatform = false;
        velocityY = jumpPower;
        penguin.classList.remove('running');
        playSound('jump');
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => keys[e.key] = false);

    game.addEventListener('click', () => {
      if (!isJumping && gameRunning) {
        isJumping = true;
        onPlatform = false;
        velocityY = jumpPower;
        penguin.classList.remove('running');
        playSound('jump');
      }
    });

    function updatePenguin() {
      penguinX += runSpeed * difficulty * 0.28;
      distance += runSpeed * difficulty * 0.12;
      score = Math.floor(distance) + (score % 10);

      if (keys['ArrowLeft'] || keys['a']) penguinX -= 4;
      if (keys['ArrowRight'] || keys['d']) penguinX += 2.8;

      if (penguinX < 40) penguinX = 40;
      if (penguinX > 340) penguinX = 340;

      if (isJumping || !onPlatform) {
        velocityY += gravity;
        penguinY += velocityY;

        if (penguinY >= 0 && !onPlatform) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
          penguin.classList.add('running');
        }
      }

      // Colisão com plataformas
      onPlatform = false;
      document.querySelectorAll('.platform').forEach(plat => {
        const platX = parseFloat(plat.style.left);
        const platBottom = parseFloat(plat.style.bottom);
        const platHeight = 22;

        if (penguinX + 45 > platX && penguinX < platX + parseFloat(plat.style.width) &&
            penguinY + 5 >= (platBottom - 90) - 8 && penguinY <= (platBottom - 90) + 10 &&
            velocityY >= 0) {
          penguinY = platBottom - 90 - 2;
          velocityY = 0;
          isJumping = false;
          onPlatform = true;
          penguin.classList.add('running');
        }
      });

      penguin.style.left = penguinX + 'px';
      penguin.style.bottom = (90 - penguinY) + 'px';

      if (invincible) {
        penguin.style.opacity = (Math.floor(Date.now() / 80) % 2) ? '0.35' : '1';
      } else {
        penguin.style.opacity = '1';
      }

      scoreEl.textContent = 'Pontos: ' + Math.floor(score);
    }

    function showPopup(x, y, txt) {
      const p = document.createElement('div');
      p.className = 'popup';
      p.textContent = txt;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      game.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }

    function createFish() {
      if (!gameRunning) return;
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = '500px';
      game.appendChild(fish);

      let x = 500;
      const spd = (3.6 + Math.random() * 1.4) * difficulty;

      function move() {
        if (!gameRunning) { fish.remove(); return; }
        x -= spd;
        fish.style.left = x + 'px';

        if (penguinY < 12 && x < penguinX + 50 && x + 30 > penguinX) {
          score += 15;
          playSound('collect');
          showPopup(penguinX + 10, 480, '+15');
          fish.remove();
          return;
        }
        if (x < -40) { fish.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function createOrca() {
      if (!gameRunning) return;
      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.textContent = '🐋';
      orca.style.left = '520px';
      game.appendChild(orca);

      let x = 520;
      const spd = (4.5 + Math.random() * 1.8) * difficulty;

      function move() {
        if (!gameRunning) { orca.remove(); return; }
        x -= spd;
        orca.style.left = x + 'px';

        if (!invincible && x < penguinX + 55 && x + 55 > penguinX && penguinY > -25) {
          hit();
        }
        if (x < -80) { orca.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function createPlatform() {
      if (!gameRunning) return;
      const plat = document.createElement('div');
      plat.className = 'platform';
      const width = 90 + Math.random() * 50;
      plat.style.width = width + 'px';
      plat.style.left = '500px';

      const heights = [50, 90, 130, 170];
      const h = heights[Math.floor(Math.random() * heights.length)];
      plat.style.bottom = (90 + h) + 'px';

      game.appendChild(plat);

      let x = 500;
      const spd = (3.7 + Math.random() * 1.3) * difficulty;

      function move() {
        if (!gameRunning) { plat.remove(); return; }
        x -= spd;
        plat.style.left = x + 'px';
        if (x < -120) { plat.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function hit() {
      lives--;
      updateLives();
      invincible = true;
      playSound('hit');
      setTimeout(() => invincible = false, 1500);
      if (lives <= 0) gameOver();
    }

    function updateLives() {
      livesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishTimer);
      clearInterval(orcaTimer);
      clearInterval(platformTimer);
      cancelAnimationFrame(animId);
      penguin.classList.remove('running');
      playSound('gameover');

      if (Math.floor(score) > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('pinguim2dHigh', highScore);
        hiscoreEl.textContent = 'Recorde: ' + highScore;
      }

      message.innerHTML = `
        <h1>Game Over</h1>
        <p>Pontos: <strong>${Math.floor(score)}</strong><br>Recorde: ${highScore}</p>
        <button id="start-btn">Jogar de Novo</button>
      `;
      message.style.display = 'block';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function loop() {
      if (!gameRunning) return;
      updatePenguin();
      difficulty = 1 + Math.floor(distance / 450) * 0.13;
      runSpeed = 3.3 + (difficulty - 1) * 0.55;
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca, .platform, .popup').forEach(el => el.remove());
      score = 0;
      distance = 0;
      lives = 3;
      difficulty = 1;
      runSpeed = 3.3;
      invincible = false;
      onPlatform = false;
      scoreEl.textContent = 'Pontos: 0';
      updateLives();
      penguinX = 130;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      message.style.display = 'none';
      gameRunning = true;
      penguin.classList.add('running');
      playSound('start');

      fishTimer = setInterval(createFish, 1100);
      orcaTimer = setInterval(createOrca, 2200);
      platformTimer = setInterval(createPlatform, 1400);

      loop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
