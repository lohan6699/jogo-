<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fusca do Pinguim - Fuja da Orca!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }

    #game {
      width: 512px;
      height: 608px;
      background: linear-gradient(
        to bottom,
        #0b0b1a 0%,
        #12122b 22%,
        #1a2a4a 45%,
        #1e3a5a 65%,
        #2a5a7a 85%,
        #3a7a9a 100%
      );
      border: 6px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 4px #222, 0 0 0 8px #555;
    }

    /* Aurora Pixel */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
    }

    .aurora1 {
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 18px,
        rgba(0, 255, 150, 0.28) 18px,
        rgba(0, 255, 150, 0.28) 38px
      );
      animation: aurora1 9s steps(6) infinite;
    }

    .aurora2 {
      background: repeating-linear-gradient(
        100deg,
        transparent 0px,
        transparent 28px,
        rgba(120, 80, 255, 0.3) 28px,
        rgba(120, 80, 255, 0.3) 52px
      );
      animation: aurora2 12s steps(5) infinite;
      opacity: 0.7;
    }

    .aurora3 {
      background: repeating-linear-gradient(
        80deg,
        transparent 0px,
        transparent 22px,
        rgba(0, 200, 255, 0.22) 22px,
        rgba(0, 200, 255, 0.22) 42px
      );
      animation: aurora3 8s steps(7) infinite;
      opacity: 0.6;
    }

    @keyframes aurora1 {
      0%   { transform: translateX(-25px); }
      100% { transform: translateX(30px); }
    }
    @keyframes aurora2 {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-35px); }
    }
    @keyframes aurora3 {
      0%   { transform: translateX(-15px); }
      100% { transform: translateX(20px); }
    }

    /* Nuvens */
    .cloud {
      position: absolute;
      background: #b8b8d0;
      z-index: 1;
    }

    #cloud1 {
      width: 70px;
      height: 20px;
      top: 50px;
      left: 30px;
      box-shadow: 14px -10px 0 #b8b8d0, 36px -6px 0 #b8b8d0, 50px 0 0 #b8b8d0;
      animation: floatCloud 18s steps(9) infinite;
    }

    #cloud2 {
      width: 55px;
      height: 16px;
      top: 95px;
      left: 290px;
      box-shadow: 12px -8px 0 #b8b8d0, 28px -4px 0 #b8b8d0;
      animation: floatCloud 24s steps(11) infinite;
      animation-delay: -7s;
    }

    @keyframes floatCloud {
      from { transform: translateX(-90px); }
      to   { transform: translateX(520px); }
    }

    /* Neve */
    .snowflake {
      position: absolute;
      color: #d0d0ff;
      font-size: 11px;
      z-index: 2;
      pointer-events: none;
      animation: fall linear infinite;
      font-family: monospace;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(620px); opacity: 0.25; }
    }

    /* Chão (gelo/água) */
    #ice {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 84px;
      background: #70b0d0;
      border-top: 4px solid #c0e0f0;
      z-index: 3;
      box-shadow: inset 0 8px 0 #90c8e0;
    }

    /* Placar */
    #score {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 13px;
      color: #ffffff;
      background: #000000;
      padding: 8px 12px;
      border: 3px solid #ffffff;
      z-index: 10;
    }

    /* Fusca do Pinguim */
    #fusca {
      position: absolute;
      bottom: 84px;
      left: 200px;
      font-size: 42px;
      z-index: 6;
      user-select: none;
      line-height: 1;
      filter: contrast(1.15);
    }

    /* Peixes */
    .fish {
      position: absolute;
      font-size: 26px;
      z-index: 5;
      user-select: none;
    }

    /* Orcas */
    .orca {
      position: absolute;
      font-size: 48px;
      z-index: 5;
      user-select: none;
      bottom: 84px;
    }

    /* Mensagens */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000000;
      padding: 26px 22px;
      border: 4px solid #ffffff;
      font-size: 13px;
      color: #ffffff;
      text-align: center;
      display: none;
      z-index: 30;
      line-height: 1.7;
      min-width: 290px;
      box-shadow: 6px 6px 0 #333;
    }

    .subtitle {
      font-size: 10px;
      margin-top: 12px;
      color: #80c0ff;
      line-height: 1.9;
    }

    #start-btn {
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 12px;
      font-family: 'Press Start 2P', cursive;
      background: #e8a020;
      color: #000000;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }

    #start-btn:hover {
      background: #ffc040;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    #start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body>

  <div id="game">
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>
    <div class="aurora aurora3"></div>

    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="score">PONTOS: 0</div>
    <div id="fusca">🐧🚗</div>
    <div id="ice"></div>

    <div id="message">
      <div>FUSCA DO<br>PINGUIM</div>
      <div class="subtitle">
        DIRIJA O FUSCA<br>
        FUJA DAS ORCAS 🐋<br>
        PEGUE OS PEIXES 🐟
      </div>
      <button id="start-btn">COMEÇAR</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const fusca = document.getElementById('fusca');
    const scoreEl = document.getElementById('score');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let fuscaX = 200;
    let fuscaY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let fishInterval, orcaInterval;
    let animationId;

    const gravity = 0.9;
    const jumpPower = -15.5;
    const speed = 6.5;

    const keys = {};

    function createSnow() {
      for (let i = 0; i < 26; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '•';
        flake.style.left = Math.random() * 512 + 'px';
        flake.style.fontSize = (8 + Math.random() * 9) + 'px';
        flake.style.animationDuration = (4 + Math.random() * 6) + 's';
        flake.style.animationDelay = (Math.random() * 7) + 's';
        game.appendChild(flake);
      }
    }
    createSnow();

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    function updateFusca() {
      if (keys['ArrowLeft'] || keys['a']) fuscaX -= speed;
      if (keys['ArrowRight'] || keys['d']) fuscaX += speed;

      if (fuscaX < 4) fuscaX = 4;
      if (fuscaX > 420) fuscaX = 420;

      if (isJumping) {
        velocityY += gravity;
        fuscaY += velocityY;

        if (fuscaY >= 0) {
          fuscaY = 0;
          isJumping = false;
          velocityY = 0;
        }
      }

      fusca.style.left = Math.round(fuscaX / 2) * 2 + 'px';
      fusca.style.bottom = (84 - Math.round(fuscaY / 2) * 2) + 'px';
    }

    function createFish() {
      if (!gameRunning) return;

      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = Math.floor(Math.random() * 22) * 20 + 'px';
      fish.style.top = '-40px';
      game.appendChild(fish);

      let fishY = -40;
      const fallSpeed = 2.1 + Math.random() * 1.6;

      function fall() {
        if (!gameRunning) {
          fish.remove();
          return;
        }

        fishY += fallSpeed;
        fish.style.top = Math.round(fishY / 2) * 2 + 'px';

        const px = fuscaX;
        const py = 608 - 84 - 42 + fuscaY;

        if (
          parseFloat(fish.style.left) < px + 55 &&
          parseFloat(fish.style.left) + 26 > px &&
          fishY < py + 42 &&
          fishY + 26 > py
        ) {
          score += 10;
          scoreEl.textContent = 'PONTOS: ' + score;
          fish.remove();
          return;
        }

        if (fishY > 530) {
          fish.remove();
          return;
        }

        requestAnimationFrame(fall);
      }

      requestAnimationFrame(fall);
    }

    function createOrca() {
      if (!gameRunning) return;

      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.textContent = '🐋';
      orca.style.left = '530px';
      game.appendChild(orca);

      let orcaX = 530;
      const moveSpeed = 4 + Math.random() * 2.8;

      function move() {
        if (!gameRunning) {
          orca.remove();
          return;
        }

        orcaX -= moveSpeed;
        orca.style.left = Math.round(orcaX / 2) * 2 + 'px';

        const px = fuscaX;
        const py = fuscaY;

        // Colisão com a orca
        if (
          orcaX < px + 58 &&
          orcaX + 48 > px &&
          py > -30
        ) {
          gameOver();
          return;
        }

        if (orcaX < -60) {
          orca.remove();
          return;
        }

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishInterval);
      clearInterval(orcaInterval);
      cancelAnimationFrame(animationId);

      message.innerHTML = `
        <div>A ORCA<br>PEGOU VOCÊ!</div>
        <div class="subtitle">PONTOS: <strong>${score}</strong></div>
        <button id="start-btn">TENTAR DE NOVO</button>
      `;
      message.style.display = 'block';

      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function gameLoop() {
      if (!gameRunning) return;
      updateFusca();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca').forEach(el => el.remove());

      score = 0;
      scoreEl.textContent = 'PONTOS: 0';
      fuscaX = 200;
      fuscaY = 0;
      isJumping = false;
      velocityY = 0;
      message.style.display = 'none';
      gameRunning = true;

      fishInterval = setInterval(createFish, 1150);
      orcaInterval = setInterval(createOrca, 1600);

      gameLoop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
