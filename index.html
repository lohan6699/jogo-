<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pinguim Runner - Pixel Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }

    #game {
      width: 512px;
      height: 608px;
      background: #0c0c1c;
      border: 8px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 4px #222, 0 0 0 12px #444;
    }

    #sky {
      position: absolute;
      inset: 0 0 96px 0;
      background: repeating-linear-gradient(
        to bottom,
        #0a0a18 0 8px,
        #101028 8px 16px,
        #16163a 16px 24px,
        #1c1c4a 24px 32px
      );
      z-index: 0;
    }

    .aurora {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 260px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }
    .aurora1 {
      background: repeating-linear-gradient(90deg, transparent 0 16px, #00ff99 16px 32px, transparent 32px 48px, #00ccff 48px 64px);
      animation: aurora 10s steps(8) infinite;
    }
    .aurora2 {
      background: repeating-linear-gradient(95deg, transparent 0 24px, #aa66ff 24px 40px, transparent 40px 64px);
      animation: aurora 14s steps(6) infinite reverse;
      opacity: 0.55;
    }
    @keyframes aurora {
      0%   { transform: translateX(-40px); }
      100% { transform: translateX(40px); }
    }

    .cloud {
      position: absolute;
      width: 8px; height: 8px;
      background: #c8c8e0;
      z-index: 2;
    }
    #cloud1 {
      top: 48px; left: 40px;
      box-shadow: 8px 0 #c8c8e0,16px 0 #c8c8e0,24px 0 #c8c8e0,32px 0 #c8c8e0,4px -8px #c8c8e0,12px -8px #c8c8e0,20px -8px #c8c8e0,28px -8px #c8c8e0,12px -16px #c8c8e0,20px -16px #c8c8e0;
      animation: cloud 16s steps(12) infinite;
    }
    #cloud2 {
      top: 100px; left: 300px;
      box-shadow: 8px 0 #c8c8e0,16px 0 #c8c8e0,24px 0 #c8c8e0,4px -8px #c8c8e0,12px -8px #c8c8e0,20px -8px #c8c8e0,12px -16px #c8c8e0;
      animation: cloud 22s steps(14) infinite;
      animation-delay: -6s;
    }
    @keyframes cloud {
      from { transform: translateX(-80px); }
      to   { transform: translateX(520px); }
    }

    .snow {
      position: absolute;
      width: 4px; height: 4px;
      background: #e0e0ff;
      z-index: 3;
      pointer-events: none;
      animation: snow linear infinite;
    }
    @keyframes snow {
      0%   { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(620px); opacity: 0.2; }
    }

    #ground {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 96px;
      background: repeating-linear-gradient(90deg, #5a9ab8 0 16px, #4a8aa8 16px 32px);
      border-top: 4px solid #a0d0e8;
      z-index: 4;
      box-shadow: inset 0 12px 0 #78b0c8;
    }

    #hud {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    #score, #lives, #hiscore {
      font-size: 11px;
      color: #fff;
      background: #000;
      padding: 6px 10px;
      border: 3px solid #fff;
    }
    #lives { color: #ff5555; }

    /* ===== PINGUIM ===== */
    #penguin {
      position: absolute;
      bottom: 96px;
      left: 160px;
      width: 4px;
      height: 4px;
      z-index: 10;
      transform-origin: center bottom;
    }
    #penguin .sprite {
      width: 4px;
      height: 4px;
      background: transparent;
      box-shadow:
        8px 0 #1a1a1a, 12px 0 #1a1a1a, 16px 0 #1a1a1a,
        4px 4px #1a1a1a, 8px 4px #ffffff, 12px 4px #ffffff, 16px 4px #ffffff, 20px 4px #1a1a1a,
        4px 8px #1a1a1a, 8px 8px #ffffff, 12px 8px #1a1a1a, 16px 8px #ffffff, 20px 8px #1a1a1a,
        4px 12px #1a1a1a, 8px 12px #ffffff, 12px 12px #ff9900, 16px 12px #ffffff, 20px 12px #1a1a1a,
        4px 16px #1a1a1a, 8px 16px #ffffff, 12px 16px #ffffff, 16px 16px #ffffff, 20px 16px #1a1a1a,
        4px 20px #1a1a1a, 8px 20px #1a1a1a, 12px 20px #1a1a1a, 16px 20px #1a1a1a, 20px 20px #1a1a1a,
        4px 24px #1a1a1a, 8px 24px #1a1a1a, 12px 24px #1a1a1a, 16px 24px #1a1a1a, 20px 24px #1a1a1a,
        8px 28px #ff9900, 16px 28px #ff9900;
    }

    /* Animação de corrida (sobe e desce levemente) */
    #penguin.running .sprite {
      animation: runBob 0.25s steps(2) infinite;
    }
    @keyframes runBob {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    /* ===== PEIXE ===== */
    .fish {
      position: absolute;
      width: 4px;
      height: 4px;
      z-index: 8;
    }
    .fish .sprite {
      width: 4px;
      height: 4px;
      background: transparent;
      box-shadow:
        4px 4px #3399ff, 8px 4px #3399ff, 12px 4px #3399ff, 16px 4px #3399ff,
        0px 8px #3399ff, 4px 8px #66ccff, 8px 8px #66ccff, 12px 8px #66ccff, 16px 8px #3399ff, 20px 8px #3399ff,
        4px 12px #3399ff, 8px 12px #3399ff, 12px 12px #3399ff, 16px 12px #3399ff,
        20px 4px #ff9933, 24px 8px #ff9933, 20px 12px #ff9933,
        8px 8px #ffffff;
    }

    /* ===== ORCA ===== */
    .orca {
      position: absolute;
      bottom: 96px;
      width: 4px;
      height: 4px;
      z-index: 8;
    }
    .orca .sprite {
      width: 4px;
      height: 4px;
      background: transparent;
      box-shadow:
        20px 0 #111, 24px 0 #111,
        16px 4px #111, 20px 4px #111, 24px 4px #111, 28px 4px #111,
        4px 8px #111, 8px 8px #111, 12px 8px #111, 16px 8px #111, 20px 8px #111, 24px 8px #111, 28px 8px #111, 32px 8px #111, 36px 8px #111,
        0px 12px #111, 4px 12px #111, 8px 12px #fff, 12px 12px #fff, 16px 12px #111, 20px 12px #111, 24px 12px #111, 28px 12px #111, 32px 12px #111, 36px 12px #111, 40px 12px #111,
        0px 16px #111, 4px 16px #111, 8px 16px #fff, 12px 16px #fff, 16px 16px #111, 20px 16px #111, 24px 16px #111, 28px 16px #111, 32px 16px #111, 36px 16px #111,
        4px 20px #111, 8px 20px #111, 12px 20px #111, 16px 20px #111, 20px 20px #111, 24px 20px #111, 28px 20px #111, 32px 20px #111,
        36px 16px #111, 40px 12px #111, 40px 20px #111, 44px 16px #111;
    }

    /* ===== OBSTÁCULO DE GELO ===== */
    .ice {
      position: absolute;
      bottom: 96px;
      width: 4px;
      height: 4px;
      z-index: 8;
    }
    .ice .sprite {
      width: 4px;
      height: 4px;
      background: transparent;
      box-shadow:
        /* bloco de gelo */
        0px 8px #a0e0ff, 4px 8px #a0e0ff, 8px 8px #a0e0ff, 12px 8px #a0e0ff, 16px 8px #a0e0ff, 20px 8px #a0e0ff,
        0px 12px #80d0f0, 4px 12px #c0f0ff, 8px 12px #c0f0ff, 12px 12px #c0f0ff, 16px 12px #c0f0ff, 20px 12px #80d0f0,
        0px 16px #80d0f0, 4px 16px #a0e0ff, 8px 16px #a0e0ff, 12px 16px #a0e0ff, 16px 16px #a0e0ff, 20px 16px #80d0f0,
        0px 20px #60b0d0, 4px 20px #80d0f0, 8px 20px #80d0f0, 12px 20px #80d0f0, 16px 20px #80d0f0, 20px 20px #60b0d0,
        4px 24px #60b0d0, 8px 24px #60b0d0, 12px 24px #60b0d0, 16px 24px #60b0d0;
    }

    .popup {
      position: absolute;
      font-size: 11px;
      color: #ffff00;
      z-index: 15;
      pointer-events: none;
      animation: popup 0.6s steps(4) forwards;
    }
    @keyframes popup {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-28px); opacity: 0; }
    }

    #message {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      padding: 24px 20px;
      border: 4px solid #fff;
      font-size: 12px;
      color: #fff;
      text-align: center;
      display: none;
      z-index: 30;
      line-height: 1.8;
      min-width: 280px;
      box-shadow: 6px 6px 0 #333;
    }
    .subtitle {
      font-size: 9px;
      margin-top: 12px;
      color: #88ccff;
      line-height: 2;
    }
    #start-btn {
      margin-top: 16px;
      padding: 10px 16px;
      font-size: 11px;
      font-family: 'Press Start 2P', cursive;
      background: #2288cc;
      color: #fff;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }
    #start-btn:hover {
      background: #33aaff;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }
  </style>
</head>
<body>

  <div id="game">
    <div id="sky"></div>
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>

    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="hud">
      <div id="score">PONTOS 0</div>
      <div id="lives">♥♥♥</div>
      <div id="hiscore">REC 0</div>
    </div>

    <div id="penguin"><div class="sprite"></div></div>
    <div id="ground"></div>

    <div id="message">
      <div>PINGUIM<br>RUNNER</div>
      <div class="subtitle">
        CORRA PARA FRENTE<br>
        PULE OS GELOS E ORCAS<br>
        3 VIDAS
      </div>
      <button id="start-btn">COMEÇAR</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const hiscoreEl = document.getElementById('hiscore');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('pinguimRunnerHigh') || '0');
    let penguinX = 160;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let invincible = false;
    let fishTimer, orcaTimer, iceTimer;
    let animId;
    let difficulty = 1;
    let runSpeed = 2.8; // velocidade automática para frente

    const gravity = 0.9;
    const jumpPower = -15.8;

    hiscoreEl.textContent = 'REC ' + highScore;

    // Neve
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('div');
      s.className = 'snow';
      s.style.left = Math.floor(Math.random() * 64) * 8 + 'px';
      s.style.animationDuration = (3.5 + Math.random() * 5) + 's';
      s.style.animationDelay = (Math.random() * 6) + 's';
      game.appendChild(s);
    }

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
        penguin.classList.remove('running');
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => keys[e.key] = false);

    function snap(v) {
      return Math.round(v / 4) * 4;
    }

    function updatePenguin() {
      // corrida automática para a frente
      penguinX += runSpeed * difficulty;

      // ajuste manual leve
      if (keys['ArrowLeft'] || keys['a']) penguinX -= 3.5;
      if (keys['ArrowRight'] || keys['d']) penguinX += 2.2;

      // limites (mantém o pinguim na tela)
      if (penguinX < 40) penguinX = 40;
      if (penguinX > 380) penguinX = 380;

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;
        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
          penguin.classList.add('running');
        }
      } else {
        penguin.classList.add('running');
      }

      penguin.style.left = snap(penguinX) + 'px';
      penguin.style.bottom = (96 - snap(penguinY)) + 'px';
      penguin.style.transform = 'scaleX(1)'; // sempre olhando para a frente

      if (invincible) {
        penguin.style.opacity = (Math.floor(Date.now() / 100) % 2) ? '0.35' : '1';
      } else {
        penguin.style.opacity = '1';
      }
    }

    function showPopup(x, y, txt) {
      const p = document.createElement('div');
      p.className = 'popup';
      p.textContent = txt;
      p.style.left = snap(x) + 'px';
      p.style.top = snap(y) + 'px';
      game.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }

    function createFish() {
      if (!gameRunning) return;
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.innerHTML = '<div class="sprite"></div>';
      fish.style.left = snap(Math.random() * 420) + 'px';
      fish.style.top = '-40px';
      game.appendChild(fish);

      let y = -40;
      const spd = 2.1 + Math.random() * 1.3;

      function fall() {
        if (!gameRunning) { fish.remove(); return; }
        y += spd;
        fish.style.top = snap(y) + 'px';

        const px = penguinX;
        const py = 608 - 96 - 32 + penguinY;

        if (parseFloat(fish.style.left) < px + 40 &&
            parseFloat(fish.style.left) + 28 > px &&
            y < py + 32 && y + 20 > py) {
          score += 10;
          scoreEl.textContent = 'PONTOS ' + score;
          showPopup(px + 8, py - 8, '+10');
          fish.remove();
          return;
        }
        if (y > 520) { fish.remove(); return; }
        requestAnimationFrame(fall);
      }
      requestAnimationFrame(fall);
    }

    function createOrca() {
      if (!gameRunning) return;
      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.innerHTML = '<div class="sprite"></div>';
      orca.style.left = '520px';
      game.appendChild(orca);

      let x = 520;
      const spd = (4.2 + Math.random() * 2.2) * difficulty;

      function move() {
        if (!gameRunning) { orca.remove(); return; }
        x -= spd;
        orca.style.left = snap(x) + 'px';

        if (!invincible &&
            x < penguinX + 48 &&
            x + 52 > penguinX &&
            penguinY > -24) {
          hit();
          return;
        }

        if (x < -70) { orca.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function createIce() {
      if (!gameRunning) return;
      const ice = document.createElement('div');
      ice.className = 'ice';
      ice.innerHTML = '<div class="sprite"></div>';
      ice.style.left = '520px';
      game.appendChild(ice);

      let x = 520;
      const spd = (3.8 + Math.random() * 1.8) * difficulty;

      function move() {
        if (!gameRunning) { ice.remove(); return; }
        x -= spd;
        ice.style.left = snap(x) + 'px';

        // colisão com obstáculo de gelo (precisa pular)
        if (!invincible &&
            x < penguinX + 44 &&
            x + 28 > penguinX &&
            penguinY > -20) {
          hit();
          return;
        }

        if (x < -50) { ice.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function hit() {
      lives--;
      updateLives();
      invincible = true;
      setTimeout(() => invincible = false, 1500);

      if (lives <= 0) {
        gameOver();
      }
    }

    function updateLives() {
      livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishTimer);
      clearInterval(orcaTimer);
      clearInterval(iceTimer);
      cancelAnimationFrame(animId);
      penguin.classList.remove('running');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('pinguimRunnerHigh', highScore);
        hiscoreEl.textContent = 'REC ' + highScore;
      }

      message.innerHTML = `
        <div>GAME OVER</div>
        <div class="subtitle">
          PONTOS ${score}<br>
          RECORDE ${highScore}
        </div>
        <button id="start-btn">DE NOVO</button>
      `;
      message.style.display = 'block';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function loop() {
      if (!gameRunning) return;
      updatePenguin();
      difficulty = 1 + Math.floor(score / 60) * 0.15;
      runSpeed = 2.8 + (difficulty - 1) * 0.6;
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca, .ice, .popup').forEach(el => el.remove());

      score = 0;
      lives = 3;
      difficulty = 1;
      runSpeed = 2.8;
      invincible = false;
      scoreEl.textContent = 'PONTOS 0';
      updateLives();
      penguinX = 160;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      penguin.style.transform = 'scaleX(1)';
      message.style.display = 'none';
      gameRunning = true;
      penguin.classList.add('running');

      fishTimer = setInterval(createFish, 1200);
      orcaTimer = setInterval(createOrca, 2200);
      iceTimer  = setInterval(createIce, 1600);

      loop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
