<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrida de Pinguins</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(#87CEEB, #E0F7FA);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      color: #01579B;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #fff;
      font-size: 2.2rem;
    }

    .info {
      background: rgba(255,255,255,0.8);
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-size: 1.1rem;
      color: #0277BD;
    }

    #pista {
      position: relative;
      width: 95%;
      max-width: 900px;
      height: 420px;
      background: linear-gradient(#E1F5FE, #B3E5FC);
      border: 8px solid #0288D1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* Linhas da pista */
    .linha {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.6);
    }

    /* Linha de chegada */
    #chegada {
      position: absolute;
      right: 40px;
      top: 0;
      width: 12px;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        #fff 0px,
        #fff 20px,
        #333 20px,
        #333 40px
      );
      z-index: 5;
    }

    .pinguim {
      position: absolute;
      left: 20px;
      font-size: 48px;
      transition: left 0.08s linear;
      z-index: 10;
      filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.2));
    }

    #jogador {
      top: 40px;
    }

    #p1 { top: 130px; }
    #p2 { top: 220px; }
    #p3 { top: 310px; }

    /* Nome dos pinguins */
    .nome {
      position: absolute;
      left: 80px;
      font-size: 14px;
      font-weight: bold;
      color: #01579B;
      background: rgba(255,255,255,0.7);
      padding: 2px 8px;
      border-radius: 10px;
    }

    #nome-jogador { top: 95px; }
    #nome-p1 { top: 185px; }
    #nome-p2 { top: 275px; }
    #nome-p3 { top: 365px; }

    .controles {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button {
      background: #0288D1;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 0 #01579B;
      transition: all 0.1s;
    }

    button:hover {
      background: #03A9F4;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #01579B;
    }

    button:disabled {
      background: #90A4AE;
      box-shadow: none;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 18px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #01579B;
      min-height: 40px;
      text-align: center;
    }

    .vencedor {
      color: #2E7D32;
      animation: pulsar 0.6s infinite alternate;
    }

    @keyframes pulsar {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    .dica {
      margin-top: 12px;
      color: #546E7A;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>Corrida de Pinguins</h1>
  <div class="info">Você é o pinguim de cima! Use → ou Espaço para correr</div>

  <div id="pista">
    <!-- Linhas da pista -->
    <div class="linha" style="top: 105px;"></div>
    <div class="linha" style="top: 195px;"></div>
    <div class="linha" style="top: 285px;"></div>

    <!-- Linha de chegada -->
    <div id="chegada"></div>

    <!-- Pinguins -->
    <div class="pinguim" id="jogador">🐧</div>
    <div class="pinguim" id="p1">🐧</div>
    <div class="pinguim" id="p2">🐧</div>
    <div class="pinguim" id="p3">🐧</div>

    <!-- Nomes -->
    <div class="nome" id="nome-jogador">Você</div>
    <div class="nome" id="nome-p1">Pinguim Azul</div>
    <div class="nome" id="nome-p2">Pinguim Rosa</div>
    <div class="nome" id="nome-p3">Pinguim Verde</div>
  </div>

  <div class="controles">
    <button id="btn-comecar">Começar Corrida!</button>
  </div>

  <div id="mensagem"></div>
  <div class="dica">Dica: quanto mais rápido você apertar, mais rápido o pinguim corre!</div>

  <script>
    const jogador = document.getElementById('jogador');
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    const p3 = document.getElementById('p3');
    const btn = document.getElementById('btn-comecar');
    const mensagem = document.getElementById('mensagem');

    const posicaoMaxima = 780; // distância até a linha de chegada
    let correndo = false;
    let intervalos = [];

    // Velocidades dos adversários (quanto maior, mais rápido)
    const velocidades = {
      p1: 4 + Math.random() * 3,
      p2: 4 + Math.random() * 3,
      p3: 4 + Math.random() * 3
    };

    function reiniciar() {
      // Para todos os intervalos
      intervalos.forEach(clearInterval);
      intervalos = [];

      // Volta os pinguins para o início
      jogador.style.left = '20px';
      p1.style.left = '20px';
      p2.style.left = '20px';
      p3.style.left = '20px';

      mensagem.textContent = '';
      mensagem.className = '';
      btn.disabled = false;
      correndo = false;

      // Novas velocidades aleatórias
      velocidades.p1 = 4 + Math.random() * 3.5;
      velocidades.p2 = 4 + Math.random() * 3.5;
      velocidades.p3 = 4 + Math.random() * 3.5;
    }

    function moverIA(pinguim, velocidade) {
      const id = setInterval(() => {
        if (!correndo) return;

        let pos = parseFloat(pinguim.style.left) || 20;
        pos += velocidade;
        pinguim.style.left = pos + 'px';

        if (pos >= posicaoMaxima) {
          finalizarCorrida(pinguim);
        }
      }, 50);
      intervalos.push(id);
    }

    function finalizarCorrida(vencedor) {
      if (!correndo) return;
      correndo = false;

      intervalos.forEach(clearInterval);
      intervalos = [];

      btn.disabled = false;

      if (vencedor === jogador) {
        mensagem.textContent = '🎉 Você venceu! Parabéns! 🎉';
        mensagem.className = 'vencedor';
      } else if (vencedor === p1) {
        mensagem.textContent = 'Pinguim Azul venceu! Tente de novo!';
      } else if (vencedor === p2) {
        mensagem.textContent = 'Pinguim Rosa venceu! Tente de novo!';
      } else {
        mensagem.textContent = 'Pinguim Verde venceu! Tente de novo!';
      }
    }

    // Movimento do jogador
    document.addEventListener('keydown', (e) => {
      if (!correndo) return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        let pos = parseFloat(jogador.style.left) || 20;
        pos += 12; // velocidade do jogador
        jogador.style.left = pos + 'px';

        if (pos >= posicaoMaxima) {
          finalizarCorrida(jogador);
        }
      }
    });

    // Botão de começar
    btn.addEventListener('click', () => {
      reiniciar();
      correndo = true;
      btn.disabled = true;
      mensagem.textContent = 'Valendo! Corra!';

      // Inicia os adversários
      setTimeout(() => {
        moverIA(p1, velocidades.p1);
        moverIA(p2, velocidades.p2);
        moverIA(p3, velocidades.p3);
      }, 300);
    });
  </script>
</body>
</html>
