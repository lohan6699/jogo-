<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowboard Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(#87CEEB, #E0F7FA);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      color: #01579B;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 white;
      font-size: 2rem;
    }

    .painel {
      display: flex;
      gap: 30px;
      margin-bottom: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #0277BD;
      background: rgba(255,255,255,0.85);
      padding: 8px 25px;
      border-radius: 30px;
    }

    #jogo {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 640px;
      background: linear-gradient(#B3E5FC 0%, #E1F5FE 40%, #FFFFFF 100%);
      border: 6px solid #0288D1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    /* Neve caindo */
    .floco {
      position: absolute;
      color: white;
      font-size: 14px;
      opacity: 0.8;
      pointer-events: none;
      animation: cair linear infinite;
    }

    @keyframes cair {
      from { transform: translateY(-20px); }
      to { transform: translateY(700px); }
    }

    /* Snowboarder */
    #player {
      position: absolute;
      font-size: 52px;
      z-index: 20;
      transition: left 0.05s linear;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
    }

    /* Obstáculos */
    .obstaculo {
      position: absolute;
      font-size: 42px;
      z-index: 10;
    }

    /* Tela de início / game over */
    #tela {
      position: absolute;
      inset: 0;
      background: rgba(1, 87, 155, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #tela h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    #tela p {
      font-size: 1.15rem;
      margin-bottom: 25px;
      max-width: 280px;
      line-height: 1.4;
    }

    button {
      background: #FF6F00;
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #E65100;
      transition: all 0.1s;
    }

    button:hover {
      background: #FF8F00;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #E65100;
    }

    .dica {
      margin-top: 14px;
      color: #546E7A;
      font-size: 0.95rem;
    }

    #recorde {
      margin-top: 8px;
      font-size: 1rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>Snowboard</h1>

  <div class="painel">
    <div>Pontos: <span id="pontos">0</span></div>
    <div>Recorde: <span id="recorde-valor">0</span></div>
  </div>

  <div id="jogo">
    <div id="player">🏂</div>
    <div id="tela">
      <h2>Snowboard!</h2>
      <p>Desça a montanha desviando das árvores e pedras.<br>Use ← → ou A D para se mover.</p>
      <button id="btn-comecar">Começar</button>
      <div id="recorde"></div>
    </div>
  </div>

  <div class="dica">Dica: a velocidade aumenta com o tempo. Boa sorte!</div>

  <script>
    const jogo = document.getElementById('jogo');
    const player = document.getElementById('player');
    const tela = document.getElementById('tela');
    const btn = document.getElementById('btn-comecar');
    const pontosEl = document.getElementById('pontos');
    const recordeEl = document.getElementById('recorde-valor');
    const recordeTexto = document.getElementById('recorde');

    // Configurações
    const LARGURA = 480;
    const ALTURA = 640;
    let playerX = LARGURA / 2 - 26;
    let pontos = 0;
    let recorde = localStorage.getItem('snowboardRecorde') || 0;
    let velocidade = 3.5;
    let gameAtivo = false;
    let obstaculos = [];
    let flocos = [];
    let teclas = {};
    let ultimoObstaculo = 0;
    let animacao;

    recordeEl.textContent = recorde;

    // Posição inicial do player
    player.style.left = playerX + 'px';
    player.style.top = '480px';

    // Controles
    document.addEventListener('keydown', e => {
      teclas[e.key.toLowerCase()] = true;
      if (['arrowleft','arrowright','a','d'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', e => {
      teclas[e.key.toLowerCase()] = false;
    });

    // Criar flocos de neve
    function criarFloco() {
      const floco = document.createElement('div');
      floco.className = 'floco';
      floco.textContent = '❄';
      floco.style.left = Math.random() * LARGURA + 'px';
      floco.style.animationDuration = (3 + Math.random() * 4) + 's';
      floco.style.fontSize = (10 + Math.random() * 12) + 'px';
      floco.style.opacity = 0.5 + Math.random() * 0.5;
      jogo.appendChild(floco);
      flocos.push(floco);

      setTimeout(() => {
        floco.remove();
        flocos = flocos.filter(f => f !== floco);
      }, 7000);
    }

    // Criar obstáculo
    function criarObstaculo() {
      const obs = document.createElement('div');
      obs.className = 'obstaculo';
      
      // 70% árvore, 30% pedra
      const tipo = Math.random() < 0.7 ? '🌲' : '🪨';
      obs.textContent = tipo;
      
      const x = 20 + Math.random() * (LARGURA - 80);
      obs.style.left = x + 'px';
      obs.style.top = '-60px';
      
      jogo.appendChild(obs);
      obstaculos.push({
        el: obs,
        x: x,
        y: -60,
        largura: 42,
        altura: 42
      });
    }

    // Verificar colisão
    function colidiu(a, b) {
      return (
        a.x < b.x + b.largura - 15 &&
        a.x + 40 > b.x + 10 &&
        a.y < b.y + b.altura - 10 &&
        a.y + 45 > b.y + 10
      );
    }

    // Game Over
    function gameOver() {
      gameAtivo = false;
      cancelAnimationFrame(animacao);

      if (pontos > recorde) {
        recorde = pontos;
        localStorage.setItem('snowboardRecorde', recorde);
        recordeEl.textContent = recorde;
        recordeTexto.textContent = `Novo recorde: ${recorde}!`;
      } else {
        recordeTexto.textContent = `Recorde atual: ${recorde}`;
      }

      tela.querySelector('h2').textContent = 'Game Over!';
      tela.querySelector('p').innerHTML = `Você fez <strong>${pontos}</strong> pontos!<br>Tente novamente.`;
      btn.textContent = 'Jogar de Novo';
      tela.style.display = 'flex';
    }

    // Loop principal
    function atualizar(timestamp) {
      if (!gameAtivo) return;

      // Movimento do player
      if (teclas['arrowleft'] || teclas['a']) {
        playerX = Math.max(10, playerX - 7);
      }
      if (teclas['arrowright'] || teclas['d']) {
        playerX = Math.min(LARGURA - 60, playerX + 7);
      }
      player.style.left = playerX + 'px';

      // Aumentar velocidade e pontos
      pontos += 1;
      pontosEl.textContent = pontos;
      velocidade = 3.5 + Math.floor(pontos / 400) * 0.6;

      // Criar obstáculos
      if (timestamp - ultimoObstaculo > 900 - Math.min(pontos / 20, 400)) {
        criarObstaculo();
        ultimoObstaculo = timestamp;
      }

      // Mover obstáculos
      for (let i = obstaculos.length - 1; i >= 0; i--) {
        const o = obstaculos[i];
        o.y += velocidade;
        o.el.style.top = o.y + 'px';

        // Colisão
        const playerBox = {
          x: playerX,
          y: 480,
          largura: 50,
          altura: 50
        };

        if (colidiu(playerBox, o)) {
          gameOver();
          return;
        }

        // Remover se saiu da tela
        if (o.y > ALTURA + 50) {
          o.el.remove();
          obstaculos.splice(i, 1);
        }
      }

      // Flocos ocasionais
      if (Math.random() < 0.08) criarFloco();

      animacao = requestAnimationFrame(atualizar);
    }

    // Iniciar / Reiniciar
    function iniciar() {
      // Limpar tudo
      obstaculos.forEach(o => o.el.remove());
      obstaculos = [];
      flocos.forEach(f => f.remove());
      flocos = [];

      pontos = 0;
      pontosEl.textContent = 0;
      velocidade = 3.5;
      playerX = LARGURA / 2 - 26;
      player.style.left = playerX + 'px';
      ultimoObstaculo = 0;

      tela.style.display = 'none';
      gameAtivo = true;
      animacao = requestAnimationFrame(atualizar);
    }

    btn.addEventListener('click', iniciar);

    // Criar alguns flocos iniciais
    for (let i = 0; i < 12; i++) {
      setTimeout(criarFloco, i * 300);
    }
  </script>
</body>
</html>
