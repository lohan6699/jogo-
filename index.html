<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo do Pinguim - Pixel Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }

    #game {
      width: 512px;
      height: 608px;
      background: linear-gradient(
        to bottom,
        #0b0b1a 0%,
        #12122b 25%,
        #1c1c3a 50%,
        #2a3a5a 75%,
        #3a5a7a 100%
      );
      border: 6px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 4px #222, 0 0 0 8px #555;
    }

    /* ========== AURORA BOREAL PIXEL ========== */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 45%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    .aurora1 {
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 20px,
        rgba(0, 255, 140, 0.25) 20px,
        rgba(0, 255, 140, 0.25) 40px
      );
      animation: auroraPixel1 8s steps(6) infinite;
    }

    .aurora2 {
      background: repeating-linear-gradient(
        95deg,
        transparent 0px,
        transparent 30px,
        rgba(100, 80, 255, 0.3) 30px,
        rgba(100, 80, 255, 0.3) 55px
      );
      animation: auroraPixel2 11s steps(5) infinite;
      opacity: 0.7;
    }

    .aurora3 {
      background: repeating-linear-gradient(
        85deg,
        transparent 0px,
        transparent 25px,
        rgba(0, 220, 255, 0.2) 25px,
        rgba(0, 220, 255, 0.2) 45px
      );
      animation: auroraPixel3 9s steps(7) infinite;
      opacity: 0.6;
    }

    @keyframes auroraPixel1 {
      0%   { transform: translateX(-30px); }
      100% { transform: translateX(30px); }
    }
    @keyframes auroraPixel2 {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-40px); }
    }
    @keyframes auroraPixel3 {
      0%   { transform: translateX(-15px); }
      100% { transform: translateX(25px); }
    }

    /* Nuvens pixel */
    .cloud {
      position: absolute;
      background: #c0c0d8;
      z-index: 1;
      image-rendering: pixelated;
    }

    #cloud1 {
      width: 80px;
      height: 24px;
      top: 48px;
      left: 40px;
      box-shadow: 
        16px -12px 0 #c0c0d8,
        40px -8px 0 #c0c0d8,
        56px 0 0 #c0c0d8;
      animation: floatCloud 20s steps(10) infinite;
    }

    #cloud2 {
      width: 60px;
      height: 18px;
      top: 100px;
      left: 280px;
      box-shadow: 
        12px -10px 0 #c0c0d8,
        32px -6px 0 #c0c0d8;
      animation: floatCloud 26s steps(12) infinite;
      animation-delay: -8s;
    }

    @keyframes floatCloud {
      from { transform: translateX(-100px); }
      to   { transform: translateX(520px); }
    }

    /* Neve */
    .snowflake {
      position: absolute;
      color: #e0e0ff;
      font-size: 12px;
      z-index: 2;
      pointer-events: none;
      animation: fall linear infinite;
      font-family: monospace;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(620px); opacity: 0.3; }
    }

    /* Chão de gelo pixel */
    #ice {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 88px;
      background: #a0d0e8;
      border-top: 4px solid #e0f0ff;
      z-index: 3;
      box-shadow: inset 0 8px 0 #c0e0f0;
    }

    /* Placar */
    #score {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 14px;
      color: #ffffff;
      background: #000000;
      padding: 8px 12px;
      border: 3px solid #ffffff;
      z-index: 10;
      text-shadow: 2px 2px 0 #000;
    }

    /* Pinguim */
    #penguin {
      position: absolute;
      bottom: 88px;
      left: 220px;
      font-size: 48px;
      z-index: 6;
      user-select: none;
      image-rendering: pixelated;
      filter: contrast(1.1);
    }

    /* Peixes */
    .fish {
      position: absolute;
      font-size: 28px;
      z-index: 5;
      user-select: none;
      image-rendering: pixelated;
    }

    /* Obstáculos */
    .obstacle {
      position: absolute;
      font-size: 40px;
      z-index: 5;
      user-select: none;
      bottom: 88px;
      image-rendering: pixelated;
    }

    /* Mensagens */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000000;
      padding: 28px 24px;
      border: 4px solid #ffffff;
      font-size: 14px;
      color: #ffffff;
      text-align: center;
      display: none;
      z-index: 30;
      line-height: 1.6;
      min-width: 280px;
      box-shadow: 6px 6px 0 #333;
    }

    .subtitle {
      font-size: 10px;
      margin-top: 12px;
      color: #a0d0ff;
      line-height: 1.8;
    }

    #start-btn {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 12px;
      font-family: 'Press Start 2P', cursive;
      background: #2080d0;
      color: #ffffff;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: none;
    }

    #start-btn:hover {
      background: #30a0f0;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    #start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body>

  <div id="game">
    <!-- Aurora -->
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>
    <div class="aurora aurora3"></div>

    <!-- Nuvens -->
    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="score">PONTOS: 0</div>
    <div id="penguin">🐧</div>
    <div id="ice"></div>

    <div id="message">
      <div>JOGO DO<br>PINGUIM</div>
      <div class="subtitle">
        PEGUE OS PEIXES 🐟<br>
        PULE OS GELOS 🧊<br>
        AURORA PIXEL
      </div>
      <button id="start-btn">COMEÇAR</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let penguinX = 220;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let fishInterval, obstacleInterval;
    let animationId;

    const gravity = 0.9;
    const jumpPower = -15;
    const speed = 6;

    const keys = {};

    // Neve pixel
    function createSnow() {
      for (let i = 0; i < 28; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '•';
        flake.style.left = Math.random() * 512 + 'px';
        flake.style.fontSize = (8 + Math.random() * 10) + 'px';
        flake.style.animationDuration = (4 + Math.random() * 6) + 's';
        flake.style.animationDelay = (Math.random() * 7) + 's';
        game.appendChild(flake);
      }
    }
    createSnow();

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    function updatePenguin() {
      if (keys['ArrowLeft'] || keys['a']) penguinX -= speed;
      if (keys['ArrowRight'] || keys['d']) penguinX += speed;

      if (penguinX < 4) penguinX = 4;
      if (penguinX > 450) penguinX = 450;

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;

        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
        }
      }

      // movimento em "passos" para ficar mais pixel
      penguin.style.left = Math.round(penguinX / 2) * 2 + 'px';
      penguin.style.bottom = (88 - Math.round(penguinY / 2) * 2) + 'px';
    }

    function createFish() {
      if (!gameRunning) return;

      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = Math.floor(Math.random() * 22) * 20 + 'px';
      fish.style.top = '-40px';
      game.appendChild(fish);

      let fishY = -40;
      const fallSpeed = 2 + Math.random() * 1.5;

      function fall() {
        if (!gameRunning) {
          fish.remove();
          return;
        }

        fishY += fallSpeed;
        fish.style.top = Math.round(fishY / 2) * 2 + 'px';

        const px = penguinX;
        const py = 608 - 88 - 48 + penguinY;

        if (
          parseFloat(fish.style.left) < px + 44 &&
          parseFloat(fish.style.left) + 28 > px &&
          fishY < py + 44 &&
          fishY + 28 > py
        ) {
          score += 10;
          scoreEl.textContent = 'PONTOS: ' + score;
          fish.remove();
          return;
        }

        if (fishY > 530) {
          fish.remove();
          return;
        }

        requestAnimationFrame(fall);
      }

      requestAnimationFrame(fall);
    }

    function createObstacle() {
      if (!gameRunning) return;

      const obs = document.createElement('div');
      obs.className = 'obstacle';
      obs.textContent = '🧊';
      obs.style.left = '520px';
      game.appendChild(obs);

      let obsX = 520;
      const moveSpeed = 3.5 + Math.random() * 2.5;

      function move() {
        if (!gameRunning) {
          obs.remove();
          return;
        }

        obsX -= moveSpeed;
        obs.style.left = Math.round(obsX / 2) * 2 + 'px';

        const px = penguinX;
        const py = penguinY;

        if (
          obsX < px + 44 &&
          obsX + 40 > px &&
          py > -28
        ) {
          gameOver();
          return;
        }

        if (obsX < -50) {
          obs.remove();
          return;
        }

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishInterval);
      clearInterval(obstacleInterval);
      cancelAnimationFrame(animationId);

      message.innerHTML = `
        <div>GAME OVER!</div>
        <div class="subtitle">PONTOS: <strong>${score}</strong></div>
        <button id="start-btn">JOGAR DE NOVO</button>
      `;
      message.style.display = 'block';

      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function gameLoop() {
      if (!gameRunning) return;
      updatePenguin();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .obstacle').forEach(el => el.remove());

      score = 0;
      scoreEl.textContent = 'PONTOS: 0';
      penguinX = 220;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      message.style.display = 'none';
      gameRunning = true;

      fishInterval = setInterval(createFish, 1100);
      obstacleInterval = setInterval(createObstacle, 1800);

      gameLoop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
