<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo do Pinguim - Obstáculos de Gelo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a1628;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    #game {
      width: 500px;
      height: 600px;
      background: linear-gradient(#87CEEB 0%, #e0f7fa 55%, #b3e5fc 100%);
      border: 6px solid #ffffff;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.4);
    }

    #ice {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(#e0f7fa, #b3e5fc);
      border-top: 4px solid #ffffff;
    }

    #score {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #01579b;
      text-shadow: 1px 1px 0 white;
      z-index: 10;
    }

    #penguin {
      position: absolute;
      bottom: 80px;
      left: 220px;
      font-size: 52px;
      z-index: 5;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      user-select: none;
      transition: transform 0.08s;
    }

    .fish {
      position: absolute;
      font-size: 32px;
      z-index: 4;
      user-select: none;
    }

    .obstacle {
      position: absolute;
      font-size: 42px;
      z-index: 4;
      user-select: none;
      bottom: 80px;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      padding: 24px 40px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      color: #01579b;
      text-align: center;
      display: none;
      z-index: 20;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      min-width: 260px;
    }

    #start-btn {
      margin-top: 14px;
      padding: 10px 28px;
      font-size: 18px;
      background: #0288d1;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    #start-btn:hover {
      background: #0277bd;
    }

    .subtitle {
      font-size: 15px;
      font-weight: normal;
      margin-top: 6px;
      color: #0277bd;
    }
  </style>
</head>
<body>

  <div id="game">
    <div id="score">Pontos: 0</div>
    <div id="penguin">🐧</div>
    <div id="ice"></div>
    <div id="message">
      <div>Jogo do Pinguim</div>
      <div class="subtitle">Pegue os peixes 🐟<br>Pule os gelos 🧊</div>
      <button id="start-btn">Começar</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let penguinX = 220;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let fishInterval, obstacleInterval;
    let animationId;

    const gravity = 0.85;
    const jumpPower = -15;
    const speed = 7;

    const keys = {};

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
      }
      // evita scroll da página
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    function updatePenguin() {
      if (keys['ArrowLeft'] || keys['a']) penguinX -= speed;
      if (keys['ArrowRight'] || keys['d']) penguinX += speed;

      if (penguinX < 0) penguinX = 0;
      if (penguinX > 440) penguinX = 440;

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;

        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
        }
      }

      penguin.style.left = penguinX + 'px';
      penguin.style.bottom = (80 - penguinY) + 'px';
    }

    function createFish() {
      if (!gameRunning) return;

      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = Math.random() * 440 + 'px';
      fish.style.top = '-40px';
      game.appendChild(fish);

      let fishY = -40;
      const fallSpeed = 2.2 + Math.random() * 1.8;

      function fall() {
        if (!gameRunning) {
          fish.remove();
          return;
        }

        fishY += fallSpeed;
        fish.style.top = fishY + 'px';

        // colisão com pinguim
        const px = penguinX;
        const py = 600 - 80 - 52 + penguinY;

        if (
          parseFloat(fish.style.left) < px + 48 &&
          parseFloat(fish.style.left) + 30 > px &&
          fishY < py + 48 &&
          fishY + 30 > py
        ) {
          score += 10;
          scoreEl.textContent = 'Pontos: ' + score;
          fish.remove();
          return;
        }

        if (fishY > 520) {
          fish.remove();
          return;
        }

        requestAnimationFrame(fall);
      }

      requestAnimationFrame(fall);
    }

    function createObstacle() {
      if (!gameRunning) return;

      const obs = document.createElement('div');
      obs.className = 'obstacle';
      obs.textContent = '🧊';
      obs.style.left = '520px';
      game.appendChild(obs);

      let obsX = 520;
      const moveSpeed = 3.5 + Math.random() * 2.5;

      function move() {
        if (!gameRunning) {
          obs.remove();
          return;
        }

        obsX -= moveSpeed;
        obs.style.left = obsX + 'px';

        // colisão com pinguim (só se não estiver pulando alto)
        const px = penguinX;
        const py = penguinY; // 0 = no chão

        if (
          obsX < px + 45 &&
          obsX + 40 > px &&
          py > -25          // se o pinguim estiver baixo demais
        ) {
          // bateu no gelo!
          gameOver();
          return;
        }

        if (obsX < -50) {
          obs.remove();
          return;
        }

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishInterval);
      clearInterval(obstacleInterval);
      cancelAnimationFrame(animationId);

      message.innerHTML = `
        <div>Game Over!</div>
        <div class="subtitle">Você fez ${score} pontos</div>
        <button id="start-btn">Jogar de novo</button>
      `;
      message.style.display = 'block';

      // precisa reatribuir o evento porque o botão foi recriado
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function gameLoop() {
      if (!gameRunning) return;
      updatePenguin();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      // limpa tudo
      document.querySelectorAll('.fish, .obstacle').forEach(el => el.remove());

      score = 0;
      scoreEl.textContent = 'Pontos: 0';
      penguinX = 220;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      message.style.display = 'none';
      gameRunning = true;

      fishInterval = setInterval(createFish, 1100);
      obstacleInterval = setInterval(createObstacle, 1800);

      gameLoop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
