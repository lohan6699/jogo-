<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pinguim Runner - Visual Sério</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #game {
      width: 480px;
      height: 700px;
      background: linear-gradient(to bottom, #02060f 0%, #061018 25%, #0a1a28 50%, #0f2a3c 100%);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1a2a3a, 0 20px 60px rgba(0,0,0,0.9);
    }

    /* Aurora séria */
    .aurora {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 50%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
      opacity: 0.45;
    }
    .aurora1 {
      background: linear-gradient(120deg, transparent 20%, rgba(0,180,140,0.15) 40%, transparent 70%);
      animation: auroraMove 18s linear infinite;
    }
    .aurora2 {
      background: linear-gradient(100deg, transparent 30%, rgba(80,40,180,0.12) 50%, transparent 80%);
      animation: auroraMove 24s linear infinite reverse;
    }
    @keyframes auroraMove {
      0% { transform: translateX(-30%); }
      100% { transform: translateX(30%); }
    }

    .snow {
      position: absolute;
      background: rgba(220,230,240,0.7);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes snowFall {
      0% { transform: translateY(-20px); opacity: 0.8; }
      100% { transform: translateY(720px); opacity: 0.05; }
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(to bottom, #1a3040 0%, #0e1e28 100%);
      border-top: 2px solid #2a4050;
      z-index: 3;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
      gap: 6px;
    }
    #score, #lives, #level, #hiscore {
      background: rgba(0,0,0,0.6);
      color: #c8d8e8;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #1a2a3a;
    }
    #lives { color: #e07070; }
    #level { color: #70b0d0; }

    /* ========== PINGUIM SÉRIO ========== */
    #penguin {
      position: absolute;
      bottom: 100px;
      left: 130px;
      width: 42px;
      height: 62px;
      z-index: 12;
      transform-origin: center bottom;
    }

    #penguin .body {
      position: absolute;
      bottom: 8px;
      left: 7px;
      width: 28px;
      height: 36px;
      background: #0e0e0e;
      border-radius: 40% 40% 30% 30%;
    }

    #penguin .belly {
      position: absolute;
      bottom: 14px;
      left: 11px;
      width: 20px;
      height: 24px;
      background: #d8d8d8;
      border-radius: 40%;
    }

    #penguin .head {
      position: absolute;
      bottom: 38px;
      left: 8px;
      width: 26px;
      height: 24px;
      background: #0e0e0e;
      border-radius: 50%;
    }

    #penguin .eye {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #e8e8e8;
      border-radius: 50%;
      top: 8px;
    }
    #penguin .eye::after {
      content: '';
      position: absolute;
      width: 2.5px;
      height: 2.5px;
      background: #111;
      border-radius: 50%;
      top: 1.2px;
      left: 1.5px;
    }
    #penguin .eye.left { left: 5px; }
    #penguin .eye.right { right: 5px; }

    #penguin .beak {
      position: absolute;
      bottom: 4px;
      left: 9px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid #c07020;
    }

    /* Nadadeiras sérias */
    #penguin .flipper {
      position: absolute;
      width: 11px;
      height: 20px;
      background: #0e0e0e;
      border-radius: 40% 40% 30% 30%;
      bottom: 20px;
    }
    #penguin .flipper.left {
      left: -2px;
      transform: rotate(-20deg);
      transform-origin: top center;
    }
    #penguin .flipper.right {
      right: -2px;
      transform: rotate(20deg);
      transform-origin: top center;
    }

    #penguin.running .flipper.left {
      animation: flipperL 0.28s ease-in-out infinite;
    }
    #penguin.running .flipper.right {
      animation: flipperR 0.28s ease-in-out infinite;
    }
    @keyframes flipperL {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(-38deg); }
    }
    @keyframes flipperR {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(38deg); }
    }

    #penguin .foot {
      position: absolute;
      bottom: 0;
      width: 11px;
      height: 7px;
      background: #c07020;
      border-radius: 4px 4px 2px 2px;
    }
    #penguin .foot.left { left: 8px; }
    #penguin .foot.right { right: 8px; }

    #penguin.running {
      animation: bodyBob 0.28s ease-in-out infinite;
    }
    @keyframes bodyBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* ========== PEIXE SÉRIO ========== */
    .fish {
      position: absolute;
      bottom: 102px;
      width: 38px;
      height: 18px;
      z-index: 8;
    }
    .fish .body {
      position: absolute;
      width: 26px;
      height: 14px;
      background: #2a6a9a;
      border-radius: 50%;
      left: 0;
      top: 2px;
    }
    .fish .tail {
      position: absolute;
      right: 0;
      top: 0;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 12px solid #1a4a70;
    }
    .fish .eye {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 50%;
      left: 7px;
      top: 5px;
    }
    .fish .eye::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      background: #111;
      border-radius: 50%;
      top: 1px;
      left: 1px;
    }

    /* ========== ORCA SÉRIA ========== */
    .orca {
      position: absolute;
      bottom: 98px;
      width: 72px;
      height: 32px;
      z-index: 9;
    }
    .orca .body {
      position: absolute;
      width: 54px;
      height: 22px;
      background: #0a0a0a;
      border-radius: 50% 35% 35% 50%;
      left: 0;
      top: 6px;
    }
    .orca .belly {
      position: absolute;
      width: 26px;
      height: 12px;
      background: #d0d0d0;
      border-radius: 50%;
      left: 8px;
      top: 13px;
    }
    .orca .fin {
      position: absolute;
      top: 0;
      left: 24px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 14px solid #0a0a0a;
    }
    .orca .tail {
      position: absolute;
      right: 0;
      top: 3px;
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 15px solid #0a0a0a;
    }
    .orca .eye {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 50%;
      left: 12px;
      top: 10px;
    }
    .orca .eye::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      background: #111;
      border-radius: 50%;
      top: 1px;
      left: 1px;
    }

    /* Plataformas de gelo sérias */
    .platform {
      position: absolute;
      bottom: 100px;
      height: 22px;
      background: linear-gradient(to bottom, #3a5a6e, #1e3344);
      border-radius: 2px;
      border: 1px solid #4a6a7e;
      box-shadow: 0 4px 0 #0a1520, 0 6px 10px rgba(0,0,0,0.4);
      z-index: 7;
    }

    .popup {
      position: absolute;
      font-size: 16px;
      font-weight: 700;
      color: #70c0e0;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      animation: popup 0.6s forwards;
    }
    @keyframes popup {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    #level-up {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #70c0e0;
      font-size: 26px;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 6px;
      z-index: 25;
      display: none;
      text-align: center;
      border: 1px solid #2a4a5a;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0a1520;
      padding: 32px 36px;
      border-radius: 8px;
      text-align: center;
      z-index: 30;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: none;
      min-width: 280px;
      border: 1px solid #1a2a3a;
    }
    #message h1 {
      font-size: 24px;
      color: #c8d8e8;
      margin-bottom: 12px;
    }
    #message p {
      font-size: 14px;
      color: #7a9ab0;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    #start-btn {
      background: #1a3a50;
      color: #c8d8e8;
      border: 1px solid #2a4a60;
      padding: 12px 32px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    #start-btn:hover {
      background: #2a4a60;
    }
  </style>
</head>
<body>

  <div id="game">
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>

    <div id="hud">
      <div id="score">Pontos: 0</div>
      <div id="level">Nível 1</div>
      <div id="lives">♥ ♥ ♥</div>
      <div id="hiscore">Rec: 0</div>
    </div>

    <div id="level-up">NÍVEL 2</div>

    <div id="penguin">
      <div class="flipper left"></div>
      <div class="flipper right"></div>
      <div class="body"></div>
      <div class="belly"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="beak"></div>
      </div>
      <div class="foot left"></div>
      <div class="foot right"></div>
    </div>

    <div id="ground"></div>

    <div id="message">
      <h1>Pinguim Runner</h1>
      <p>
        Visual sério<br>
        Física de corrida e pulo<br>
        10 Níveis
      </p>
      <button id="start-btn">Iniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(380, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'gameover') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'start' || type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(420, now + 0.08);
        osc.frequency.setValueAtTime(560, now + 0.16);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }

    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const hiscoreEl = document.getElementById('hiscore');
    const message = document.getElementById('message');
    const levelUpEl = document.getElementById('level-up');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let level = 1;
    let highScore = parseInt(localStorage.getItem('pinguimSeriousHigh') || '0');
    
    let penguinX = 130;
    let penguinY = 0;
    let velocityX = 0;
    let velocityY = 0;
    
    let gameRunning = false;
    let invincible = false;
    let onGround = true;

    const AUTO_FORCE = 0.28;
    const ACCEL = 0.55;
    const FRICTION = 0.88;
    const MAX_SPEED_BASE = 4.8;

    let jumpHeld = false;
    let coyoteTime = 0;
    let jumpBuffer = 0;
    const COYOTE_MAX = 8;
    const BUFFER_MAX = 10;
    const JUMP_FORCE = -15.5;
    const GRAVITY_UP = 0.55;
    const GRAVITY_DOWN = 1.15;
    const MAX_FALL = 18;

    let fishTimer, orcaTimer, platformTimer;
    let animId;
    let distance = 0;
    let nextLevelScore = 420;

    hiscoreEl.textContent = 'Rec: ' + highScore;

    for (let i = 0; i < 40; i++) {
      const flake = document.createElement('div');
      flake.className = 'snow';
      const size = 1.5 + Math.random() * 3;
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.left = Math.random() * 480 + 'px';
      flake.style.animation = `snowFall ${6 + Math.random() * 8}s linear infinite`;
      flake.style.animationDelay = Math.random() * 10 + 's';
      flake.style.opacity = 0.3 + Math.random() * 0.4;
      game.appendChild(flake);
    }

    const keys = {};

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && gameRunning) {
        jumpBuffer = BUFFER_MAX;
        jumpHeld = true;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
      if (e.key === 'ArrowUp' || e.key === ' ') jumpHeld = false;
    });

    game.addEventListener('mousedown', () => {
      if (gameRunning) {
        jumpBuffer = BUFFER_MAX;
        jumpHeld = true;
      }
    });
    game.addEventListener('mouseup', () => jumpHeld = false);

    function tryJump() {
      if ((onGround || coyoteTime > 0) && jumpBuffer > 0) {
        velocityY = JUMP_FORCE;
        onGround = false;
        coyoteTime = 0;
        jumpBuffer = 0;
        penguin.classList.remove('running');
        playSound('jump');
        return true;
      }
      return false;
    }

    function updatePenguin() {
      velocityX += AUTO_FORCE;

      if (keys['ArrowLeft'] || keys['a']) velocityX -= ACCEL;
      if (keys['ArrowRight'] || keys['d']) velocityX += ACCEL * 0.7;

      velocityX *= FRICTION;

      const maxSpeed = MAX_SPEED_BASE + (level - 1) * 0.35;
      if (velocityX > maxSpeed) velocityX = maxSpeed;
      if (velocityX < -maxSpeed * 0.7) velocityX = -maxSpeed * 0.7;

      penguinX += velocityX;

      if (penguinX < 40) { penguinX = 40; velocityX = 0; }
      if (penguinX > 350) { penguinX = 350; velocityX *= 0.5; }

      distance += Math.max(0.1, velocityX * 0.4);
      score = Math.floor(distance);

      if (score >= nextLevelScore && level < 10) {
        level++;
        nextLevelScore += 480 + level * 60;
        levelEl.textContent = 'Nível ' + level;
        showLevelUp();
        playSound('levelup');
      }

      if (jumpBuffer > 0) jumpBuffer--;
      if (coyoteTime > 0) coyoteTime--;

      tryJump();

      if (velocityY < 0) {
        if (!jumpHeld) velocityY += GRAVITY_UP * 2.8;
        else velocityY += GRAVITY_UP;
      } else {
        velocityY += GRAVITY_DOWN;
      }

      if (velocityY > MAX_FALL) velocityY = MAX_FALL;
      penguinY += velocityY;

      if (penguinY >= 0) {
        penguinY = 0;
        velocityY = 0;
        if (!onGround) {
          onGround = true;
          penguin.classList.add('running');
        }
        coyoteTime = COYOTE_MAX;
      } else {
        onGround = false;
      }

      document.querySelectorAll('.platform').forEach(plat => {
        const platX = parseFloat(plat.style.left);
        const platW = parseFloat(plat.style.width);

        if (penguinX + 42 > platX && penguinX < platX + platW &&
            penguinY > -8 && penguinY < 24 && velocityY >= 0) {
          penguinY = 0;
          velocityY = 0;
          onGround = true;
          coyoteTime = COYOTE_MAX;
          penguin.classList.add('running');
        }
      });

      penguin.style.left = penguinX + 'px';
      penguin.style.bottom = (100 - penguinY) + 'px';

      const tilt = Math.max(-6, Math.min(6, velocityX * 1.1));
      penguin.style.transform = `rotate(${tilt}deg)`;

      if (invincible) {
        penguin.style.opacity = (Math.floor(Date.now() / 90) % 2) ? '0.3' : '1';
      } else {
        penguin.style.opacity = '1';
      }

      scoreEl.textContent = 'Pontos: ' + Math.floor(score);
    }

    function showLevelUp() {
      levelUpEl.textContent = 'NÍVEL ' + level;
      levelUpEl.style.display = 'block';
      setTimeout(() => levelUpEl.style.display = 'none', 1400);
    }

    function showPopup(x, y, txt) {
      const p = document.createElement('div');
      p.className = 'popup';
      p.textContent = txt;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      game.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }

    function createFish() {
      if (!gameRunning) return;
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.innerHTML = `<div class="body"></div><div class="tail"></div><div class="eye"></div>`;
      fish.style.left = '510px';
      game.appendChild(fish);

      let x = 510;
      const spd = (3.6 + Math.random() * 1.5) * (1 + level * 0.09);

      function move() {
        if (!gameRunning) { fish.remove(); return; }
        x -= spd;
        fish.style.left = x + 'px';

        if (penguinY < 16 && x < penguinX + 44 && x + 36 > penguinX) {
          score += 20;
          playSound('collect');
          showPopup(penguinX + 8, 470, '+20');
          fish.remove();
          return;
        }
        if (x < -50) { fish.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function createOrca() {
      if (!gameRunning) return;
      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.innerHTML = `
        <div class="fin"></div>
        <div class="body"></div>
        <div class="belly"></div>
        <div class="tail"></div>
        <div class="eye"></div>
      `;
      orca.style.left = '530px';
      game.appendChild(orca);

      let x = 530;
      const spd = (4.5 + Math.random() * 1.8) * (1 + level * 0.11);

      function move() {
        if (!gameRunning) { orca.remove(); return; }
        x -= spd;
        orca.style.left = x + 'px';

        if (!invincible && x < penguinX + 58 && x + 65 > penguinX && penguinY > -22) {
          hit();
        }
        if (x < -90) { orca.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function createPlatform() {
      if (!gameRunning) return;
      const plat = document.createElement('div');
      plat.className = 'platform';
      const width = 90 + Math.random() * 80;
      plat.style.width = width + 'px';
      plat.style.left = '510px';
      plat.style.bottom = '100px';
      game.appendChild(plat);

      let x = 510;
      const spd = (3.7 + Math.random() * 1.3) * (1 + level * 0.09);

      function move() {
        if (!gameRunning) { plat.remove(); return; }
        x -= spd;
        plat.style.left = x + 'px';
        if (x < -140) { plat.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function hit() {
      lives--;
      updateLives();
      invincible = true;
      playSound('hit');
      setTimeout(() => invincible = false, 1500);
      if (lives <= 0) gameOver();
    }

    function updateLives() {
      livesEl.textContent = '♥ '.repeat(lives).trim() + (lives < 3 ? ' ♡'.repeat(3 - lives) : '');
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishTimer);
      clearInterval(orcaTimer);
      clearInterval(platformTimer);
      cancelAnimationFrame(animId);
      penguin.classList.remove('running');
      playSound('gameover');

      if (Math.floor(score) > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('pinguimSeriousHigh', highScore);
        hiscoreEl.textContent = 'Rec: ' + highScore;
      }

      message.innerHTML = `
        <h1>Game Over</h1>
        <p>
          Pontos: <strong>${Math.floor(score)}</strong><br>
          Nível: <strong>${level}</strong><br>
          Recorde: ${highScore}
        </p>
        <button id="start-btn">Jogar Novamente</button>
      `;
      message.style.display = 'block';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function loop() {
      if (!gameRunning) return;
      updatePenguin();
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca, .platform, .popup').forEach(el => el.remove());
      score = 0;
      distance = 0;
      lives = 3;
      level = 1;
      nextLevelScore = 420;
      invincible = false;
      onGround = true;
      velocityX = 0;
      velocityY = 0;
      coyoteTime = 0;
      jumpBuffer = 0;
      jumpHeld = false;
      scoreEl.textContent = 'Pontos: 0';
      levelEl.textContent = 'Nível 1';
      updateLives();
      penguinX = 130;
      penguinY = 0;
      message.style.display = 'none';
      gameRunning = true;
      penguin.classList.add('running');
      playSound('start');

      fishTimer = setInterval(createFish, 1150);
      orcaTimer = setInterval(createOrca, 2050);
      platformTimer = setInterval(createPlatform, 1550);

      loop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
