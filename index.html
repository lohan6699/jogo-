<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pinguim vs Orca - Pixel</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background: #080810;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }

    #game {
      width: 512px;
      height: 608px;
      background: linear-gradient(
        to bottom,
        #0a0a18 0%,
        #12122a 20%,
        #1a2a48 45%,
        #1e3a58 70%,
        #2a5a78 100%
      );
      border: 6px solid #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 4px #222, 0 0 0 8px #444;
    }

    /* Aurora */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 42%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }
    .aurora1 {
      background: repeating-linear-gradient(90deg, transparent 0 18px, rgba(0,255,150,0.28) 18px 38px);
      animation: a1 9s steps(6) infinite;
    }
    .aurora2 {
      background: repeating-linear-gradient(100deg, transparent 0 28px, rgba(120,80,255,0.3) 28px 52px);
      animation: a2 12s steps(5) infinite;
      opacity: 0.7;
    }
    .aurora3 {
      background: repeating-linear-gradient(80deg, transparent 0 22px, rgba(0,200,255,0.22) 22px 42px);
      animation: a3 8s steps(7) infinite;
      opacity: 0.55;
    }
    @keyframes a1 { 0%{transform:translateX(-25px)} 100%{transform:translateX(30px)} }
    @keyframes a2 { 0%{transform:translateX(20px)} 100%{transform:translateX(-35px)} }
    @keyframes a3 { 0%{transform:translateX(-15px)} 100%{transform:translateX(20px)} }

    /* Nuvens */
    .cloud {
      position: absolute;
      background: #b0b0c8;
      z-index: 1;
    }
    #cloud1 {
      width: 70px; height: 20px; top: 48px; left: 30px;
      box-shadow: 14px -10px 0 #b0b0c8, 36px -6px 0 #b0b0c8, 50px 0 0 #b0b0c8;
      animation: cloud 18s steps(9) infinite;
    }
    #cloud2 {
      width: 55px; height: 16px; top: 95px; left: 290px;
      box-shadow: 12px -8px 0 #b0b0c8, 28px -4px 0 #b0b0c8;
      animation: cloud 24s steps(11) infinite;
      animation-delay: -7s;
    }
    @keyframes cloud {
      from { transform: translateX(-90px); }
      to   { transform: translateX(520px); }
    }

    /* Neve */
    .snow {
      position: absolute;
      color: #d0d0ff;
      font-size: 11px;
      z-index: 2;
      pointer-events: none;
      animation: fall linear infinite;
      font-family: monospace;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(620px); opacity: 0.2; }
    }

    /* Chão */
    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 84px;
      background: #68a8c8;
      border-top: 4px solid #c0e0f0;
      z-index: 3;
      box-shadow: inset 0 8px 0 #88c0d8;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    #score, #lives, #hiscore {
      font-size: 12px;
      color: #fff;
      background: #000;
      padding: 6px 10px;
      border: 3px solid #fff;
    }
    #lives {
      color: #ff6b6b;
    }

    /* Pinguim */
    #penguin {
      position: absolute;
      bottom: 84px;
      left: 200px;
      font-size: 48px;
      z-index: 6;
      user-select: none;
      transition: transform 0.08s;
      filter: contrast(1.1);
    }

    /* Peixes e Orcas */
    .fish, .orca {
      position: absolute;
      z-index: 5;
      user-select: none;
    }
    .fish { font-size: 26px; }
    .orca { font-size: 48px; bottom: 84px; }

    /* Popup de pontos */
    .popup {
      position: absolute;
      font-size: 12px;
      color: #ffe066;
      z-index: 15;
      pointer-events: none;
      animation: pop 0.7s forwards;
    }
    @keyframes pop {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    /* Tela de mensagem */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      padding: 28px 24px;
      border: 4px solid #fff;
      font-size: 13px;
      color: #fff;
      text-align: center;
      display: none;
      z-index: 30;
      line-height: 1.7;
      min-width: 300px;
      box-shadow: 6px 6px 0 #333;
    }
    .subtitle {
      font-size: 10px;
      margin-top: 12px;
      color: #80c0ff;
      line-height: 1.9;
    }
    #start-btn {
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 12px;
      font-family: 'Press Start 2P', cursive;
      background: #2080d0;
      color: #fff;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }
    #start-btn:hover {
      background: #40a0f0;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }
  </style>
</head>
<body>

  <div id="game">
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>
    <div class="aurora aurora3"></div>

    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="hud">
      <div id="score">PONTOS: 0</div>
      <div id="lives">❤️❤️❤️</div>
      <div id="hiscore">RECORDE: 0</div>
    </div>

    <div id="penguin">🐧</div>
    <div id="ground"></div>

    <div id="message">
      <div>PINGUIM<br>VS ORCA</div>
      <div class="subtitle">
        FUJA DAS ORCAS 🐋<br>
        PEGUE OS PEIXES 🐟<br>
        VOCÊ TEM 3 VIDAS
      </div>
      <button id="start-btn">COMEÇAR</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const hiscoreEl = document.getElementById('hiscore');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let highScore = localStorage.getItem('pinguimHighScore') || 0;
    let penguinX = 200;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let invincible = false;
    let fishInterval, orcaInterval;
    let animationId;
    let difficulty = 1;

    const gravity = 0.88;
    const jumpPower = -15.8;
    const baseSpeed = 6.2;

    hiscoreEl.textContent = 'RECORDE: ' + highScore;

    const keys = {};

    // Neve
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('div');
      s.className = 'snow';
      s.textContent = '•';
      s.style.left = Math.random() * 512 + 'px';
      s.style.fontSize = (8 + Math.random() * 9) + 'px';
      s.style.animationDuration = (4 + Math.random() * 6) + 's';
      s.style.animationDelay = (Math.random() * 7) + 's';
      game.appendChild(s);
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => keys[e.key] = false);

    function updatePenguin() {
      let moving = false;
      if (keys['ArrowLeft'] || keys['a']) {
        penguinX -= baseSpeed;
        penguin.style.transform = 'scaleX(-1)';
        moving = true;
      }
      if (keys['ArrowRight'] || keys['d']) {
        penguinX += baseSpeed;
        penguin.style.transform = 'scaleX(1)';
        moving = true;
      }

      if (penguinX < 4) penguinX = 4;
      if (penguinX > 448) penguinX = 448;

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;
        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
        }
      }

      penguin.style.left = Math.round(penguinX / 2) * 2 + 'px';
      penguin.style.bottom = (84 - Math.round(penguinY / 2) * 2) + 'px';

      // piscar quando invencível
      if (invincible) {
        penguin.style.opacity = penguin.style.opacity === '0.4' ? '1' : '0.4';
      } else {
        penguin.style.opacity = '1';
      }
    }

    function showPopup(x, y, text) {
      const p = document.createElement('div');
      p.className = 'popup';
      p.textContent = text;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      game.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }

    function createFish() {
      if (!gameRunning) return;
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = Math.floor(Math.random() * 22) * 20 + 'px';
      fish.style.top = '-40px';
      game.appendChild(fish);

      let y = -40;
      const speed = 2.1 + Math.random() * 1.5;

      function fall() {
        if (!gameRunning) { fish.remove(); return; }
        y += speed;
        fish.style.top = Math.round(y / 2) * 2 + 'px';

        const px = penguinX;
        const py = 608 - 84 - 48 + penguinY;

        if (parseFloat(fish.style.left) < px + 48 &&
            parseFloat(fish.style.left) + 26 > px &&
            y < py + 48 && y + 26 > py) {
          score += 10;
          scoreEl.textContent = 'PONTOS: ' + score;
          showPopup(px + 10, py - 10, '+10');
          fish.remove();
          return;
        }
        if (y > 530) { fish.remove(); return; }
        requestAnimationFrame(fall);
      }
      requestAnimationFrame(fall);
    }

    function createOrca() {
      if (!gameRunning) return;
      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.textContent = '🐋';
      orca.style.left = '530px';
      game.appendChild(orca);

      let x = 530;
      const speed = (3.8 + Math.random() * 2.2) * difficulty;

      function move() {
        if (!gameRunning) { orca.remove(); return; }
        x -= speed;
        orca.style.left = Math.round(x / 2) * 2 + 'px';

        if (!invincible &&
            x < penguinX + 50 &&
            x + 48 > penguinX &&
            penguinY > -28) {
          // bateu
          lives--;
          updateLives();
          invincible = true;
          setTimeout(() => invincible = false, 1500);

          if (lives <= 0) {
            gameOver();
            return;
          }
        }

        if (x < -60) { orca.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function updateLives() {
      livesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishInterval);
      clearInterval(orcaInterval);
      cancelAnimationFrame(animationId);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('pinguimHighScore', highScore);
        hiscoreEl.textContent = 'RECORDE: ' + highScore;
      }

      message.innerHTML = `
        <div>A ORCA<br>PEGOU VOCÊ!</div>
        <div class="subtitle">
          PONTOS: <strong>${score}</strong><br>
          RECORDE: ${highScore}
        </div>
        <button id="start-btn">TENTAR DE NOVO</button>
      `;
      message.style.display = 'block';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function gameLoop() {
      if (!gameRunning) return;
      updatePenguin();
      // aumenta dificuldade aos poucos
      difficulty = 1 + Math.floor(score / 80) * 0.15;
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca, .popup').forEach(el => el.remove());

      score = 0;
      lives = 3;
      difficulty = 1;
      invincible = false;
      scoreEl.textContent = 'PONTOS: 0';
      updateLives();
      penguinX = 200;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      penguin.style.transform = 'scaleX(1)';
      message.style.display = 'none';
      gameRunning = true;

      fishInterval = setInterval(createFish, 1100);
      orcaInterval = setInterval(createOrca, 1550);

      gameLoop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
