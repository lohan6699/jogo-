<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pinguim vs Orca - Pixel Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body {
      background: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }

    #game {
      width: 512px;
      height: 608px;
      background: #0c0c1c;
      border: 8px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 0 0 4px #222222,
        0 0 0 12px #444444;
    }

    /* Céu em faixas pixel */
    #sky {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 420px;
      background: repeating-linear-gradient(
        to bottom,
        #0a0a18 0px,
        #0a0a18 8px,
        #101028 8px,
        #101028 16px,
        #16163a 16px,
        #16163a 24px,
        #1c1c4a 24px,
        #1c1c4a 32px,
        #22225a 32px,
        #22225a 40px
      );
      z-index: 0;
    }

    /* Aurora pixel (blocos) */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 280px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }
    .aurora1 {
      background: repeating-linear-gradient(
        90deg,
        transparent 0 16px,
        #00ff99 16px 32px,
        transparent 32px 48px,
        #00ccff 48px 64px
      );
      animation: auroraMove 10s steps(8) infinite;
    }
    .aurora2 {
      background: repeating-linear-gradient(
        95deg,
        transparent 0 24px,
        #aa66ff 24px 40px,
        transparent 40px 64px
      );
      animation: auroraMove 14s steps(6) infinite reverse;
      opacity: 0.6;
    }
    @keyframes auroraMove {
      0%   { transform: translateX(-40px); }
      100% { transform: translateX(40px); }
    }

    /* Nuvens pixel (feitas com box-shadow) */
    .cloud {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #c8c8e0;
      z-index: 2;
    }
    #cloud1 {
      top: 48px;
      left: 40px;
      box-shadow:
        8px 0 #c8c8e0, 16px 0 #c8c8e0, 24px 0 #c8c8e0, 32px 0 #c8c8e0,
        4px -8px #c8c8e0, 12px -8px #c8c8e0, 20px -8px #c8c8e0, 28px -8px #c8c8e0,
        12px -16px #c8c8e0, 20px -16px #c8c8e0;
      animation: cloudMove 16s steps(12) infinite;
    }
    #cloud2 {
      top: 100px;
      left: 300px;
      box-shadow:
        8px 0 #c8c8e0, 16px 0 #c8c8e0, 24px 0 #c8c8e0,
        4px -8px #c8c8e0, 12px -8px #c8c8e0, 20px -8px #c8c8e0,
        12px -16px #c8c8e0;
      animation: cloudMove 22s steps(14) infinite;
      animation-delay: -6s;
    }
    @keyframes cloudMove {
      from { transform: translateX(-80px); }
      to   { transform: translateX(520px); }
    }

    /* Neve pixel */
    .snow {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #e0e0ff;
      z-index: 3;
      pointer-events: none;
      animation: snowFall linear infinite;
    }
    @keyframes snowFall {
      0%   { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(620px); opacity: 0.2; }
    }

    /* Chão pixel */
    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 96px;
      background: repeating-linear-gradient(
        90deg,
        #5a9ab8 0 16px,
        #4a8aa8 16px 32px
      );
      border-top: 4px solid #a0d0e8;
      z-index: 4;
      box-shadow: inset 0 12px 0 #78b0c8;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    #score, #lives, #hiscore {
      font-size: 11px;
      color: #ffffff;
      background: #000000;
      padding: 6px 10px;
      border: 3px solid #ffffff;
      text-shadow: none;
    }
    #lives { color: #ff5555; }

    /* Pinguim (emoji forçado a pixel) */
    #penguin {
      position: absolute;
      bottom: 96px;
      left: 200px;
      font-size: 42px;
      z-index: 10;
      user-select: none;
      transform-origin: center bottom;
      filter: contrast(1.2) saturate(1.1);
    }

    /* Peixes e Orcas */
    .fish, .orca {
      position: absolute;
      z-index: 8;
      user-select: none;
      filter: contrast(1.15);
    }
    .fish { font-size: 24px; }
    .orca { 
      font-size: 44px; 
      bottom: 96px;
    }

    /* Popup */
    .popup {
      position: absolute;
      font-size: 11px;
      color: #ffff00;
      z-index: 15;
      pointer-events: none;
      animation: popup 0.6s steps(4) forwards;
    }
    @keyframes popup {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-28px); opacity: 0; }
    }

    /* Mensagem */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000000;
      padding: 24px 20px;
      border: 4px solid #ffffff;
      font-size: 12px;
      color: #ffffff;
      text-align: center;
      display: none;
      z-index: 30;
      line-height: 1.8;
      min-width: 280px;
      box-shadow: 6px 6px 0 #333333;
    }
    .subtitle {
      font-size: 9px;
      margin-top: 12px;
      color: #88ccff;
      line-height: 2;
    }
    #start-btn {
      margin-top: 16px;
      padding: 10px 16px;
      font-size: 11px;
      font-family: 'Press Start 2P', cursive;
      background: #2288cc;
      color: #ffffff;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000000;
    }
    #start-btn:hover {
      background: #33aaff;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000000;
    }
  </style>
</head>
<body>

  <div id="game">
    <div id="sky"></div>
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>

    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="hud">
      <div id="score">PONTOS 0</div>
      <div id="lives">♥♥♥</div>
      <div id="hiscore">REC 0</div>
    </div>

    <div id="penguin">🐧</div>
    <div id="ground"></div>

    <div id="message">
      <div>PINGUIM<br>VS ORCA</div>
      <div class="subtitle">
        FUJA DAS ORCAS<br>
        PEGUE OS PEIXES<br>
        3 VIDAS
      </div>
      <button id="start-btn">COMEÇAR</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const hiscoreEl = document.getElementById('hiscore');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('pinguimPixelHigh') || '0');
    let penguinX = 200;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let invincible = false;
    let fishTimer, orcaTimer;
    let animId;
    let difficulty = 1;

    const gravity = 0.9;
    const jumpPower = -15.5;
    const moveSpeed = 5.5;

    hiscoreEl.textContent = 'REC ' + highScore;

    // Neve pixel
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('div');
      s.className = 'snow';
      s.style.left = Math.floor(Math.random() * 64) * 8 + 'px';
      s.style.animationDuration = (3.5 + Math.random() * 5) + 's';
      s.style.animationDelay = (Math.random() * 6) + 's';
      game.appendChild(s);
    }

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => keys[e.key] = false);

    function snap(v) {
      return Math.round(v / 4) * 4; // movimento em grid de 4px
    }

    function updatePenguin() {
      if (keys['ArrowLeft'] || keys['a']) {
        penguinX -= moveSpeed;
        penguin.style.transform = 'scaleX(-1)';
      }
      if (keys['ArrowRight'] || keys['d']) {
        penguinX += moveSpeed;
        penguin.style.transform = 'scaleX(1)';
      }

      penguinX = Math.max(4, Math.min(448, penguinX));

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;
        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
        }
      }

      penguin.style.left = snap(penguinX) + 'px';
      penguin.style.bottom = (96 - snap(penguinY)) + 'px';

      // efeito de piscar quando toma dano
      if (invincible) {
        penguin.style.opacity = (Math.floor(Date.now() / 100) % 2) ? '0.35' : '1';
      } else {
        penguin.style.opacity = '1';
      }
    }

    function showPopup(x, y, txt) {
      const p = document.createElement('div');
      p.className = 'popup';
      p.textContent = txt;
      p.style.left = snap(x) + 'px';
      p.style.top = snap(y) + 'px';
      game.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }

    function createFish() {
      if (!gameRunning) return;
      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = snap(Math.random() * 440) + 'px';
      fish.style.top = '-32px';
      game.appendChild(fish);

      let y = -32;
      const spd = 2 + Math.random() * 1.4;

      function fall() {
        if (!gameRunning) { fish.remove(); return; }
        y += spd;
        fish.style.top = snap(y) + 'px';

        const px = penguinX;
        const py = 608 - 96 - 42 + penguinY;

        if (parseFloat(fish.style.left) < px + 44 &&
            parseFloat(fish.style.left) + 24 > px &&
            y < py + 42 && y + 24 > py) {
          score += 10;
          scoreEl.textContent = 'PONTOS ' + score;
          showPopup(px + 8, py - 8, '+10');
          fish.remove();
          return;
        }
        if (y > 520) { fish.remove(); return; }
        requestAnimationFrame(fall);
      }
      requestAnimationFrame(fall);
    }

    function createOrca() {
      if (!gameRunning) return;
      const orca = document.createElement('div');
      orca.className = 'orca';
      orca.textContent = '🐋';
      orca.style.left = '520px';
      game.appendChild(orca);

      let x = 520;
      const spd = (3.6 + Math.random() * 2.0) * difficulty;

      function move() {
        if (!gameRunning) { orca.remove(); return; }
        x -= spd;
        orca.style.left = snap(x) + 'px';

        if (!invincible &&
            x < penguinX + 46 &&
            x + 46 > penguinX &&
            penguinY > -26) {
          lives--;
          updateLives();
          invincible = true;
          setTimeout(() => invincible = false, 1600);

          if (lives <= 0) {
            gameOver();
            return;
          }
        }

        if (x < -60) { orca.remove(); return; }
        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }

    function updateLives() {
      livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishTimer);
      clearInterval(orcaTimer);
      cancelAnimationFrame(animId);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('pinguimPixelHigh', highScore);
        hiscoreEl.textContent = 'REC ' + highScore;
      }

      message.innerHTML = `
        <div>GAME OVER</div>
        <div class="subtitle">
          PONTOS ${score}<br>
          RECORDE ${highScore}
        </div>
        <button id="start-btn">DE NOVO</button>
      `;
      message.style.display = 'block';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function loop() {
      if (!gameRunning) return;
      updatePenguin();
      difficulty = 1 + Math.floor(score / 70) * 0.18;
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .orca, .popup').forEach(el => el.remove());

      score = 0;
      lives = 3;
      difficulty = 1;
      invincible = false;
      scoreEl.textContent = 'PONTOS 0';
      updateLives();
      penguinX = 200;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      penguin.style.transform = 'scaleX(1)';
      message.style.display = 'none';
      gameRunning = true;

      fishTimer = setInterval(createFish, 1150);
      orcaTimer = setInterval(createOrca, 1500);

      loop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
