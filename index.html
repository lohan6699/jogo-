<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo do Pinguim - Visual Melhorado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020b18;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    #game {
      width: 520px;
      height: 620px;
      background: linear-gradient(
        to bottom,
        #0b1c3a 0%,
        #1a3a6e 25%,
        #3a7ca5 55%,
        #7ec8e3 78%,
        #c8e9f5 100%
      );
      border: 8px solid #e8f4ff;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 0 0 4px #7eb8e0,
        0 20px 50px rgba(0, 40, 80, 0.6),
        inset 0 0 80px rgba(255,255,255,0.1);
    }

    /* Nuvens decorativas */
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 50px;
      filter: blur(1px);
      opacity: 0.7;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
    }

    #cloud1 {
      width: 120px; height: 40px;
      top: 50px; left: 30px;
      animation: floatCloud 28s linear infinite;
    }
    #cloud1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
    #cloud1::after  { width: 60px; height: 40px; top: -15px; left: 50px; }

    #cloud2 {
      width: 90px; height: 30px;
      top: 100px; left: 280px;
      animation: floatCloud 35s linear infinite;
      animation-delay: -10s;
    }
    #cloud2::before { width: 40px; height: 40px; top: -20px; left: 10px; }
    #cloud2::after  { width: 45px; height: 30px; top: -10px; left: 40px; }

    @keyframes floatCloud {
      from { transform: translateX(-150px); }
      to   { transform: translateX(600px); }
    }

    /* Neve caindo */
    .snowflake {
      position: absolute;
      color: white;
      font-size: 14px;
      opacity: 0.8;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
      text-shadow: 0 0 6px rgba(255,255,255,0.8);
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(650px) rotate(360deg); opacity: 0.3; }
    }

    /* Chão de gelo */
    #ice {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 95px;
      background: linear-gradient(
        to bottom,
        rgba(200, 240, 255, 0.95) 0%,
        #a8d8f0 40%,
        #7ec8e3 100%
      );
      border-top: 3px solid rgba(255,255,255,0.9);
      box-shadow: 
        inset 0 8px 20px rgba(255,255,255,0.6),
        0 -10px 30px rgba(100, 180, 220, 0.3);
      z-index: 2;
    }

    /* Brilho no gelo */
    #ice::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.4) 30%,
        rgba(255,255,255,0.7) 50%,
        rgba(255,255,255,0.4) 70%,
        transparent 100%
      );
      opacity: 0.6;
    }

    /* Placar */
    #score {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(10, 40, 80, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.3);
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Pinguim */
    #penguin {
      position: absolute;
      bottom: 95px;
      left: 220px;
      font-size: 58px;
      z-index: 6;
      filter: drop-shadow(0 8px 12px rgba(0,30,60,0.35));
      user-select: none;
      transition: transform 0.08s;
      animation: idle 2.2s ease-in-out infinite;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    /* Peixes */
    .fish {
      position: absolute;
      font-size: 34px;
      z-index: 5;
      user-select: none;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
      animation: swim 1.4s ease-in-out infinite;
    }

    @keyframes swim {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }

    /* Obstáculos de gelo */
    .obstacle {
      position: absolute;
      font-size: 48px;
      z-index: 5;
      user-select: none;
      bottom: 95px;
      filter: drop-shadow(0 6px 10px rgba(0,60,100,0.35));
    }

    /* Mensagens (início / game over) */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 32px 40px;
      border-radius: 24px;
      font-size: 26px;
      font-weight: 700;
      color: #0d47a1;
      text-align: center;
      display: none;
      z-index: 30;
      box-shadow: 
        0 15px 40px rgba(0,40,80,0.25),
        0 0 0 4px rgba(255,255,255,0.6);
      min-width: 280px;
      border: 2px solid rgba(100,180,230,0.4);
    }

    .subtitle {
      font-size: 15px;
      font-weight: 500;
      margin-top: 10px;
      color: #1565c0;
      line-height: 1.5;
    }

    #start-btn {
      margin-top: 20px;
      padding: 12px 36px;
      font-size: 18px;
      background: linear-gradient(135deg, #0288d1, #0277bd);
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(2, 119, 189, 0.45);
      transition: all 0.2s;
    }

    #start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(2, 119, 189, 0.55);
      background: linear-gradient(135deg, #039be5, #0288d1);
    }

    #start-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="game">
    <!-- Nuvens -->
    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>

    <div id="score">Pontos: 0</div>
    <div id="penguin">🐧</div>
    <div id="ice"></div>

    <div id="message">
      <div>Jogo do Pinguim</div>
      <div class="subtitle">
        Pegue os peixes 🐟<br>
        Pule os blocos de gelo 🧊
      </div>
      <button id="start-btn">Começar</button>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const penguin = document.getElementById('penguin');
    const scoreEl = document.getElementById('score');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let penguinX = 220;
    let penguinY = 0;
    let isJumping = false;
    let velocityY = 0;
    let gameRunning = false;
    let fishInterval, obstacleInterval;
    let animationId;

    const gravity = 0.85;
    const jumpPower = -15.5;
    const speed = 7.5;

    const keys = {};

    // Cria flocos de neve
    function createSnow() {
      for (let i = 0; i < 35; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = Math.random() * 520 + 'px';
        flake.style.fontSize = (10 + Math.random() * 12) + 'px';
        flake.style.animationDuration = (4 + Math.random() * 7) + 's';
        flake.style.animationDelay = (Math.random() * 8) + 's';
        flake.style.opacity = 0.4 + Math.random() * 0.5;
        game.appendChild(flake);
      }
    }
    createSnow();

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && gameRunning) {
        isJumping = true;
        velocityY = jumpPower;
        penguin.style.animation = 'none'; // para a animação idle no pulo
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    function updatePenguin() {
      if (keys['ArrowLeft'] || keys['a']) penguinX -= speed;
      if (keys['ArrowRight'] || keys['d']) penguinX += speed;

      if (penguinX < 5) penguinX = 5;
      if (penguinX > 450) penguinX = 450;

      if (isJumping) {
        velocityY += gravity;
        penguinY += velocityY;

        if (penguinY >= 0) {
          penguinY = 0;
          isJumping = false;
          velocityY = 0;
          penguin.style.animation = 'idle 2.2s ease-in-out infinite';
        }
      }

      penguin.style.left = penguinX + 'px';
      penguin.style.bottom = (95 - penguinY) + 'px';
    }

    function createFish() {
      if (!gameRunning) return;

      const fish = document.createElement('div');
      fish.className = 'fish';
      fish.textContent = '🐟';
      fish.style.left = Math.random() * 450 + 'px';
      fish.style.top = '-50px';
      game.appendChild(fish);

      let fishY = -50;
      const fallSpeed = 2.3 + Math.random() * 1.7;

      function fall() {
        if (!gameRunning) {
          fish.remove();
          return;
        }

        fishY += fallSpeed;
        fish.style.top = fishY + 'px';

        const px = penguinX;
        const py = 620 - 95 - 58 + penguinY;

        if (
          parseFloat(fish.style.left) < px + 50 &&
          parseFloat(fish.style.left) + 32 > px &&
          fishY < py + 50 &&
          fishY + 30 > py
        ) {
          score += 10;
          scoreEl.textContent = 'Pontos: ' + score;
          fish.remove();
          return;
        }

        if (fishY > 540) {
          fish.remove();
          return;
        }

        requestAnimationFrame(fall);
      }

      requestAnimationFrame(fall);
    }

    function createObstacle() {
      if (!gameRunning) return;

      const obs = document.createElement('div');
      obs.className = 'obstacle';
      obs.textContent = '🧊';
      obs.style.left = '540px';
      game.appendChild(obs);

      let obsX = 540;
      const moveSpeed = 3.8 + Math.random() * 2.8;

      function move() {
        if (!gameRunning) {
          obs.remove();
          return;
        }

        obsX -= moveSpeed;
        obs.style.left = obsX + 'px';

        const px = penguinX;
        const py = penguinY;

        // colisão (só se estiver próximo do chão)
        if (
          obsX < px + 48 &&
          obsX + 42 > px &&
          py > -30
        ) {
          gameOver();
          return;
        }

        if (obsX < -60) {
          obs.remove();
          return;
        }

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function gameOver() {
      gameRunning = false;
      clearInterval(fishInterval);
      clearInterval(obstacleInterval);
      cancelAnimationFrame(animationId);

      message.innerHTML = `
        <div>Game Over!</div>
        <div class="subtitle">Você fez <strong>${score}</strong> pontos</div>
        <button id="start-btn">Jogar de novo</button>
      `;
      message.style.display = 'block';

      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function gameLoop() {
      if (!gameRunning) return;
      updatePenguin();
      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      document.querySelectorAll('.fish, .obstacle').forEach(el => el.remove());

      score = 0;
      scoreEl.textContent = 'Pontos: 0';
      penguinX = 220;
      penguinY = 0;
      isJumping = false;
      velocityY = 0;
      message.style.display = 'none';
      gameRunning = true;

      penguin.style.animation = 'idle 2.2s ease-in-out infinite';

      fishInterval = setInterval(createFish, 1050);
      obstacleInterval = setInterval(createObstacle, 1750);

      gameLoop();
    }

    startBtn.addEventListener('click', startGame);
    message.style.display = 'block';
  </script>
</body>
</html>
